<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" fill="none">
  <!-- Simple monochrome of the official BookOrbit book + orbit mark -->
  <g stroke="#000000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- open book -->
    <path d="M32 14v34"/>
    <path d="M32 16c-7-4.5-15-5.5-22-4.5v30c7.5-1 15.5 0 22 4.5"/>
    <path d="M32 16c7-4.5 15-5.5 22-4.5v30c-7.5-1-15.5 0-22 4.5"/>
    <!-- orbit ring -->
    <ellipse cx="32" cy="33" rx="24" ry="11" transform="rotate(-35 32 33)"/>
  </g>
  <!-- planet / moon on the orbit -->
  <circle cx="49" cy="21" r="3.2" fill="#000000"/>
  <circle cx="15" cy="45" r="2.6" fill="#000000"/>
</svg>
