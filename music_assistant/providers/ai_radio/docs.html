<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Radio API Commands</title>
  <style>
    :root {
      --bg: #0e1117;
      --panel: #151a22;
      --panel-2: #1b2230;
      --text: #e7edf8;
      --muted: #9eabc3;
      --primary: #03a9f4;
      --border: rgba(255, 255, 255, 0.14);
      --ok: #41c985;
      --warn: #f6c243;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Roboto", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
      background: radial-gradient(1200px 500px at 100% 0%, rgba(3,169,244,0.14), transparent 55%), var(--bg);
      color: var(--text);
      padding: 16px;
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(18, 24, 34, 0.92);
      backdrop-filter: blur(6px);
    }
    .topbar h1 { margin: 0; font-size: 1.15rem; }
    .topbar .links { display: flex; gap: 8px; flex-wrap: wrap; }
    .topbar a {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      text-decoration: none;
      background: rgba(255,255,255,0.03);
    }
    .topbar a:hover { border-color: rgba(3,169,244,0.65); }

    .panel {
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(21, 26, 34, 0.92);
      padding: 14px;
    }
    .hint { color: var(--muted); margin-top: 6px; }

    .search-wrap {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }
    input[type="search"] {
      width: 100%;
      min-height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      padding: 8px 10px;
      font-size: 0.95rem;
    }

    .summary-line {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 8px;
    }

    .command {
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 10px;
      overflow: hidden;
      background: var(--panel);
    }
    .cmd-head {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--panel-2);
      cursor: pointer;
      user-select: none;
    }
    .cmd-title {
      font-family: "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace;
      font-size: 0.93rem;
      color: #89d8ff;
      font-weight: 600;
      margin: 0;
    }
    .cmd-role {
      color: var(--warn);
      font-size: 0.8rem;
      border: 1px solid rgba(246,194,67,0.45);
      padding: 2px 7px;
      border-radius: 999px;
    }
    .cmd-body {
      display: none;
      padding: 10px 12px;
    }
    .command.open .cmd-body { display: block; }
    .desc { color: var(--muted); margin: 0 0 10px; }
    .block-title {
      margin: 8px 0 6px;
      font-weight: 600;
      color: #c7d8f5;
      font-size: 0.9rem;
    }
    .param {
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 6px;
      background: rgba(255,255,255,0.02);
    }
    .param code { color: #8fe3ff; }
    pre {
      margin: 0;
      overflow: auto;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0c1017;
      color: #e9f1ff;
      font-family: "JetBrains Mono", "Roboto Mono", Menlo, Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.35;
      white-space: pre;
    }
    .empty {
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>AI Radio API Commands</h1>
    <div class="links">
      <a href="/api-docs" target="_blank" rel="noopener">Global API Docs</a>
      <a href="/api-docs/commands" target="_blank" rel="noopener">Global Commands</a>
      <a href="./" target="_blank" rel="noopener">AI Radio UI</a>
    </div>
  </header>

  <section class="panel">
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Filter ai_radio commands, params, descriptions...">
      <div id="summary" class="summary-line">Loading commands…</div>
    </div>
    <div id="commands"></div>
  </section>

  <script>
    const $search = document.getElementById('search');
    const $summary = document.getElementById('summary');
    const $commands = document.getElementById('commands');

    function escapeHtml(v) {
      return String(v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function toExample(command, params) {
      const args = {};
      (params || []).forEach((p) => {
        if (p.required) {
          args[p.name] = p.example !== undefined ? p.example : `<${p.type || 'value'}>`;
        }
      });
      return {
        message_id: 'example-' + Math.random().toString(16).slice(2, 8),
        command,
        args
      };
    }

    function renderParam(param) {
      const required = param.required ? ' <strong>(required)</strong>' : '';
      const type = param.type ? ` <span style="color:#9cb0cc">[${escapeHtml(param.type)}]</span>` : '';
      const desc = param.description ? `<div style="color:#9eabc3;margin-top:2px">${escapeHtml(param.description)}</div>` : '';
      return `<div class="param"><code>${escapeHtml(param.name)}</code>${required}${type}${desc}</div>`;
    }

    function normalizeCommands(items) {
      return (items || [])
        .filter((item) => item && typeof item === 'object')
        .filter((item) => String(item.command || '').startsWith('ai_radio/'))
        .sort((a, b) => String(a.command).localeCompare(String(b.command)));
    }

    function matches(item, term) {
      if (!term) return true;
      const blob = JSON.stringify(item).toLowerCase();
      return blob.includes(term);
    }

    function render(items, searchTerm = '') {
      const term = String(searchTerm || '').trim().toLowerCase();
      const filtered = items.filter((item) => matches(item, term));
      $summary.textContent = `${filtered.length} of ${items.length} AI Radio commands shown`;

      if (!filtered.length) {
        $commands.innerHTML = '<div class="empty">No matching AI Radio commands found.</div>';
        return;
      }

      $commands.innerHTML = filtered.map((item, idx) => {
        const command = String(item.command || '');
        const description = String(item.description || item.summary || '').trim();
        const params = Array.isArray(item.params) ? item.params : [];
        const requiredRole = item.required_role ? String(item.required_role) : 'admin';
        const returns = item.return_type ? String(item.return_type) : 'object';
        const example = toExample(command, params);

        return `
          <article class="command" data-index="${idx}">
            <div class="cmd-head" role="button" tabindex="0" aria-expanded="false">
              <h3 class="cmd-title">${escapeHtml(command)}</h3>
              <span class="cmd-role">${escapeHtml(requiredRole)}</span>
            </div>
            <div class="cmd-body">
              ${description ? `<p class="desc">${escapeHtml(description)}</p>` : ''}

              <div class="block-title">Parameters</div>
              ${params.length ? params.map(renderParam).join('') : '<div class="empty">No parameters</div>'}

              <div class="block-title">Return Type</div>
              <div class="param"><code>${escapeHtml(returns)}</code></div>

              <div class="block-title">JSON-RPC Example</div>
              <pre>${escapeHtml(JSON.stringify(example, null, 2))}</pre>
            </div>
          </article>
        `;
      }).join('');

      document.querySelectorAll('.cmd-head').forEach((head) => {
        const toggle = () => {
          const card = head.closest('.command');
          card.classList.toggle('open');
          head.setAttribute('aria-expanded', card.classList.contains('open') ? 'true' : 'false');
        };
        head.addEventListener('click', toggle);
        head.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            toggle();
          }
        });
      });
    }

    async function loadCommands() {
      try {
        const response = await fetch('/api-docs/commands.json', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const commands = normalizeCommands(data);
        render(commands, '');
        $search.addEventListener('input', () => render(commands, $search.value));
      } catch (err) {
        $summary.textContent = 'Failed to load commands.';
        $commands.innerHTML = `<div class="empty">${escapeHtml(err && err.message ? err.message : String(err))}</div>`;
      }
    }

    loadCommands();
  </script>
</body>
</html>
