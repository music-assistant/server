<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Web Kiosk</title>
<script>
try {
  var q = new URLSearchParams(location.search);
  if (q.get('sendspin') !== '0') document.documentElement.classList.add('sendspin');
  if (q.get('controls') === '1') document.documentElement.classList.add('controls');
} catch (e) {}
</script>
<style>
:root { --bg:#0c0c10; --fg:#ececf2; --muted:#9a9aa6; --accent:#4f8cff; }
* { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; overflow:hidden; }
body.kiosk { background:#000; }
#kiosk { display:none; position:fixed; top:0; right:0; bottom:0; left:0; background:#000; color:#fff; overflow:hidden; }
body.kiosk #kiosk { display:block; }
#kiosk-bg { position:absolute; top:0; right:0; bottom:0; left:0; background-size:cover; background-position:center; filter:blur(40px) brightness(.4); transform:scale(1.1); transition:opacity .8s; }
#kiosk-bg img { width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .8s; }
#kiosk-center { position:absolute; top:0; right:0; bottom:0; left:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; padding:40px 40px 24px; z-index:2; min-height:0; }
html.controls #kiosk-center { bottom:calc(var(--kiosk-bar-height) + 16px); }
#kiosk-artbox { position:relative; width:46vw; height:46vw; max-width:46vh; width:min(46vh,46vw); height:min(46vh,46vw); max-height:46vh; max-height:min(46vh,46vw); flex:0 1 auto; min-height:0; border-radius:14px; background:#16161c; box-shadow:0 20px 60px rgba(0,0,0,.6); overflow:hidden; }
#kiosk-art { position:absolute; top:0; right:0; bottom:0; left:0; width:100%; height:100%; object-fit:cover; display:none; }
#kiosk-artbox.has-art #kiosk-art { display:block; }
#kiosk-title { font-size:32px; font-size:clamp(20px,4vw,44px); font-weight:700; text-align:center; text-shadow:0 2px 20px rgba(0,0,0,.8); max-width:92vw; }
#kiosk-artist { font-size:20px; font-size:clamp(15px,2.6vw,26px); color:#cfcfe0; text-align:center; max-width:92vw; }
#kiosk-viz { position:absolute; top:0; right:0; bottom:0; left:0; z-index:1; width:100%; height:100%; }
#kiosk-lyrics { margin-top:14px; width:92vw; max-width:720px; width:min(720px,92vw); text-align:center; }
#kiosk-lyrics .l { margin:0; line-height:1.3; min-height:1.3em; color:rgba(255,255,255,.4); font-size:16px; font-size:clamp(13px,1.8vw,18px); }
#kiosk-lyrics .l.current { color:#fff; font-weight:600; font-size:22px; font-size:clamp(16px,2.6vw,26px); }
#kiosk-queue { position:absolute; right:16px; top:16px; width:340px; max-width:calc(100vw - 32px); width:min(340px,calc(100vw - 32px)); max-height:55vh; overflow-y:auto; z-index:4; background:rgba(10,10,14,.55); border-radius:12px; padding:12px; backdrop-filter:blur(8px); }
#kiosk-queue .qrow { display:flex; align-items:center; gap:10px; padding:6px; border-radius:8px; font-size:14px; }
#kiosk-queue .qrow.active { background:rgba(255,255,255,.12); }
#kiosk-queue .qrow img { width:34px; height:34px; border-radius:5px; object-fit:cover; flex-shrink:0; }
#kiosk-queue .qmeta { flex:1; min-width:0; display:flex; flex-direction:column; }
#kiosk-queue .qt { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#kiosk-queue .qa { color:#9a9aa6; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#kiosk-sync { position:absolute; top:16px; left:50%; transform:translateX(-50%); z-index:6; font-size:12px; letter-spacing:1px; color:#9a9aa6; padding:6px 12px; border-radius:20px; background:rgba(10,10,14,.5); }
#kiosk-sync.synced { color:#7ce38b; }
#kiosk-sync.error { color:#ff8a8a; }
#k-fullscreen { position:absolute; top:16px; top:max(16px,env(safe-area-inset-top,0px)); right:16px; right:max(16px,env(safe-area-inset-right,0px)); z-index:9; width:40px; height:40px; border-radius:20px; background:rgba(10,10,14,.5); }
html.fullscreen-button #kiosk-queue { top:64px; top:max(64px,calc(env(safe-area-inset-top,0px) + 48px)); }
#kiosk-pair { position:absolute; left:50%; top:64px; transform:translateX(-50%); z-index:7; padding:14px 22px; border-radius:12px; background:rgba(10,10,14,.82); font-size:22px; letter-spacing:2px; text-align:center; }
#kiosk-status { position:absolute; top:48px; left:50%; transform:translateX(-50%); z-index:8; max-width:calc(100vw - 32px); max-width:min(420px,calc(100vw - 32px)); font-size:13px; color:#ffd2d2; background:rgba(10,10,14,.72); padding:8px 12px; border-radius:8px; text-align:center; }
#kiosk-status.audio-prompt { top:50%; transform:translate(-50%,-50%); font-size:22px; font-size:clamp(16px,2.4vw,22px); padding:16px 22px; cursor:pointer; }
@media (max-width:1100px) {
  #kiosk-queue { top:52px; right:12px; left:12px; width:auto; max-height:22vh; }
  html.queue-active body.kiosk #kiosk-center { justify-content:flex-start; padding:28vh 16px 24px; }
}
.hidden { display:none !important; }
</style>
<link rel="stylesheet" href="/web/player-controls.css">
</head>
<body class="kiosk">

  <symbol id="k-icon-pause" viewBox="0 0 24 24"><rect x="14" y="3" width="5" height="18" rx="1"></rect><rect x="5" y="3" width="5" height="18" rx="1"></rect></symbol>
  <symbol id="k-icon-skip-back" viewBox="0 0 24 24"><path d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"></path><path d="M3 20V4"></path></symbol>

<div id="kiosk">
  <button type="button" id="k-fullscreen" class="kiosk-control hidden" aria-label="Enter fullscreen" title="Enter fullscreen" aria-pressed="false"><svg class="kiosk-icon" viewBox="0 0 24 24" aria-hidden="true"><use id="k-fullscreen-icon" href="#k-icon-maximize" xlink:href="#k-icon-maximize"></use></svg></button>
  <canvas id="kiosk-viz"></canvas>
  <div id="kiosk-bg"><img id="kiosk-bg-img" alt=""></div>
  <div id="kiosk-center">
    <div id="kiosk-media-details">
      <div id="kiosk-artbox">
        <img id="kiosk-art" alt="HTML5" src="/web/html5.svg">
        <button type="button" id="kiosk-party-expanded" class="hidden" aria-label="Close Party QR" title="Close Party QR">
          <img id="kiosk-party-art" alt="Join Party">
        </button>
      </div>
      <div id="kiosk-title">—</div>
      <div id="kiosk-artist">—</div>
    </div>
    <div id="kiosk-lyrics" class="hidden" aria-live="polite"></div>
  </div>
  <div id="kiosk-sync"></div>
  <div id="kiosk-player-id" class="hidden"></div>
  <div id="kiosk-pair" class="hidden"></div>
  <div id="kiosk-status" class="hidden" role="status"></div>
  <div id="kiosk-queue" class="hidden"></div>
  <div id="kiosk-controls" role="region" aria-label="Player controls">
    <div id="kiosk-bar-track">
      <div id="kiosk-bar-artbox">
        <img id="kiosk-bar-art" alt="" class="hidden">
        <svg class="kiosk-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#k-icon-music" xlink:href="#k-icon-music"></use></svg>
        <button type="button" id="kiosk-party" class="hidden" aria-label="Enlarge Party QR" aria-expanded="false" aria-controls="kiosk-party-expanded">
          <img id="kiosk-party-thumbnail" alt="Join Party">
        </button>
      </div>
      <div id="kiosk-bar-meta">
        <div id="kiosk-bar-title">Nothing playing</div>
        <div id="kiosk-bar-artist">Web Kiosk</div>
      </div>
    </div>
    <div id="kiosk-player-center">
      <div id="kiosk-transport">
        <button type="button" id="k-prev" class="kiosk-control" aria-label="Previous" title="Previous"><svg class="kiosk-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#k-icon-skip-back" xlink:href="#k-icon-skip-back"></use></svg></button>
        <button type="button" id="k-play" class="kiosk-control" aria-label="Play" title="Play"><svg class="kiosk-icon" viewBox="0 0 24 24" aria-hidden="true"><use id="k-play-icon" href="#k-icon-play" xlink:href="#k-icon-play"></use></svg></button>
        <button type="button" id="k-next" class="kiosk-control" aria-label="Next" title="Next"><svg class="kiosk-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#k-icon-skip-forward" xlink:href="#k-icon-skip-forward"></use></svg></button>
      </div>
      <div id="kiosk-progress">
        <input type="range" id="kiosk-seek" class="kiosk-slider" min="0" max="1000" value="0" aria-label="Position">
        <div id="kiosk-time-labels"><span id="kiosk-time">0:00</span><span id="kiosk-dur">0:00</span></div>
      </div>
    </div>
    <div id="kiosk-bar-actions">
      <div id="kiosk-volume-control">
        <button type="button" id="k-volume-button" class="kiosk-control" aria-label="Volume: 100%" aria-controls="kiosk-volume-panel" aria-expanded="false" title="Volume">
          <svg class="kiosk-icon" viewBox="0 0 24 24" aria-hidden="true"><use id="k-volume-icon" href="#k-icon-volume-2" xlink:href="#k-icon-volume-2"></use></svg>
          <span id="k-volume-level">100%</span>
        </button>
        <div id="kiosk-volume-panel" role="group" aria-label="Volume">
          <div class="volume-panel-heading">
            <span>Volume</span>
            <button type="button" id="k-volume-close" class="kiosk-control" aria-label="Close volume" title="Close"><svg class="kiosk-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#k-icon-x" xlink:href="#k-icon-x"></use></svg></button>
          </div>
          <div class="volume-range-row">
            <svg class="kiosk-icon" viewBox="0 0 24 24" aria-hidden="true"><use id="k-volume-slider-icon" href="#k-icon-volume-2" xlink:href="#k-icon-volume-2"></use></svg>
            <input type="range" id="kiosk-volume" class="kiosk-slider" min="0" max="100" value="100" aria-label="Volume">
            <span id="k-volume-panel-level">100%</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/web/web.js"></script>
</body>
</html>
