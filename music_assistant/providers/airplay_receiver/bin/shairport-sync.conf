// Shairport Sync configuration file template for Music Assistant
// This file will be copied and customized for each AirPlay receiver instance

general =
{
	name = "{AIRPLAY_NAME}";
	ignore_volume_control = "yes";
	output_backend = "pipe";
	default_airplay_volume = {DEFAULT_VOLUME};
	port = {PORT};
	// Using tinysvcmdns (embedded mDNS, no external daemon required)
};

metadata =
{
	enabled = "yes";
	include_cover_art = "yes";
	pipe_name = "{METADATA_PIPE}";
	pipe_timeout = 0;  // Don't timeout, keep pipe open
};

pipe =
{
	name = "{AUDIO_PIPE}";
};

// Enable D-Bus interface for remote control (play/pause/next/previous)
// Uses session bus with local dbus-daemon started by Music Assistant
// NOTE: shairport-sync seems to ignore bus_type setting and always tries system bus first
// The environment variable DBUS_SESSION_BUS_ADDRESS should make it use session bus
dbus =
{
	enabled = "yes";
	bus_type = "session";  // Use session bus with local dbus-daemon
};
