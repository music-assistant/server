<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <!-- Allow any user to own the shairport-sync D-Bus services -->
  <policy context="default">
    <!-- Allow owning the base service and all PID-suffixed instances -->
    <allow own="org.gnome.ShairportSync"/>
    <allow own_prefix="org.gnome.ShairportSync.i"/>

    <!-- Allow sending messages to the services -->
    <allow send_destination="org.gnome.ShairportSync"/>
    <allow send_destination_prefix="org.gnome.ShairportSync.i"/>

    <!-- Allow owning MPRIS interfaces -->
    <allow own="org.mpris.MediaPlayer2.ShairportSync"/>
    <allow own_prefix="org.mpris.MediaPlayer2.ShairportSync.i"/>

    <!-- Allow sending messages to MPRIS interfaces -->
    <allow send_destination="org.mpris.MediaPlayer2.ShairportSync"/>
    <allow send_destination_prefix="org.mpris.MediaPlayer2.ShairportSync.i"/>
  </policy>

</busconfig>
