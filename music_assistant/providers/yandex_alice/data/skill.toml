# Yandex Alice skill manifest — declarative source of truth for what
# the auto-create / auto-update pipeline ships to dialogs.yandex.ru
# AND for the runtime dispatcher that turns matched intents into
# ParsedControl / ParsedCommand on the webhook side.
#
# Format: TOML. Each ``grammar`` and the entities ``text`` block use
# TOML triple-quoted strings — content is preserved byte-for-byte, so
# you can copy / paste a Granet ``sourceText`` from the dev console
# (https://dialogs.yandex.ru/developer/skills/<id>/draft/settings/intents)
# directly into ``grammar = """ ... """``.
#
# Schema:
#   schema_version            — bump when shape changes (loader rejects newer)
#   [entities]                — single Granet block, ships via set_entities
#     text                    — full customEntities sourceText
#   [[intents]]               — one per intent, order-preserving
#     form_name               — Yandex API formName (stable across edits)
#     human_readable_name     — Yandex API humanReadableName (UI label)
#     is_activation           — Yandex API isActivation (default false)
#     positive_tests          — newline-separated phrases (Yandex positiveTests)
#     negative_tests          — newline-separated phrases (Yandex negativeTests)
#     grammar                 — Granet sourceText (sent verbatim to Yandex)
#   [intents.runtime]         — runtime dispatch metadata (since 1.6.0)
#     kind                    — "control" | "play" (consumer-interpreted)
#     action                  — ControlAction literal | ParsedCommand.kind
#   [[intents.runtime.mapping]] — optional slot-to-field mapping rules
#     field                   — target ParsedControl/ParsedCommand field
#     from_slot               — slot name in request.nlu.intents.<form>.slots
#     slot_type               — "int" (default) | "str"
#     transform               — "identity" (default) | "clamp" | "abs_clamp"
#     min, max                — clamp bounds
#     cap                     — skip the intent if value > cap (post-multiply)
#     default                 — value when slot is missing
#     sign                    — "positive" (default) | "negative"
#     reject_if_below         — skip the intent if value < this (post-multiply)
#   [[intents.runtime.mapping.multiply_when]] — conditional unit multiplier
#     slot, equals, factor    — multiply value by `factor` when slot==equals
#
# Granet shape rules empirically pinned through v1.4.x:
#   - Single-line alternation only (``|`` at start of continuation line
#     is rejected as "Пустой элемент").
#   - ``%lemma`` directive: standalone above alternation; never inside
#     ``[...]`` optional blocks; never after ``|``.
#   - Slot declarations live inside ``sourceText`` as a ``slots:``
#     sub-block — the ya-dialogs-api 2.2.0+ client sees this and skips
#     auto-composing structured slots.

schema_version = 1

[entities]
text = """
entity time_unit:
    values:
        seconds:
            секунда | секунды | секунд | сек
        minutes:
            минута | минуты | минут | мин
"""


