# ===========================================================================
# v1.4.0 — slot-bearing intents.
# ===========================================================================

[[intents]]
form_name = "control.volume_set"
human_readable_name = "Громкость на N процентов"
positive_tests = """
громкость 50
громкость на 30 процентов
сделай громкость 75
"""
grammar = """
root:
    %lemma
    громкость [на] $Level [процент | процентов | процента] | сделать громкость [на] $Level [процент | процентов | процента]
$Level: $YANDEX.NUMBER
slots:
    level:
        type: YANDEX.NUMBER
        source: $Level
"""
[intents.runtime]
kind = "control"
action = "volume_set"
[[intents.runtime.mapping]]
field = "value"
from_slot = "level"
transform = "clamp"
min = 0
max = 100

[[intents]]
form_name = "control.volume_increase"
human_readable_name = "Прибавить громкость на N"
positive_tests = """
прибавь на 20
прибавь на 15 процентов
на 10 громче
"""
grammar = """
root:
    %lemma
    прибавить [на] $Delta [процент | процентов | процента] | сделать громче на $Delta [процент | процентов | процента] | на $Delta [процент | процентов | процента] громче
$Delta: $YANDEX.NUMBER
slots:
    delta:
        type: YANDEX.NUMBER
        source: $Delta
"""
[intents.runtime]
kind = "control"
action = "volume_relative"
[[intents.runtime.mapping]]
field = "value"
from_slot = "delta"
transform = "abs_clamp"
min = 0
max = 100
default = 10
sign = "positive"

[[intents]]
form_name = "control.volume_decrease"
human_readable_name = "Убавить громкость на N"
positive_tests = """
убавь на 20
убавь на 25 процентов
на 15 тише
"""
grammar = """
root:
    %lemma
    убавить [на] $Delta [процент | процентов | процента] | сделать тише на $Delta [процент | процентов | процента] | на $Delta [процент | процентов | процента] тише
$Delta: $YANDEX.NUMBER
slots:
    delta:
        type: YANDEX.NUMBER
        source: $Delta
"""
[intents.runtime]
kind = "control"
action = "volume_relative"
[[intents.runtime.mapping]]
field = "value"
from_slot = "delta"
transform = "abs_clamp"
min = 0
max = 100
default = 10
sign = "negative"

[[intents]]
form_name = "control.seek_forward"
human_readable_name = "Перемотать вперёд"
positive_tests = """
перемотай вперёд на 30 секунд
перемотай вперёд на 2 минуты
вперёд 15 секунд
"""
negative_tests = """
назад 30 секунд
"""
grammar = """
root:
    %lemma
    вперёд [на] $Amount [$Unit] | перемотать вперёд [на] $Amount [$Unit]
$Amount: $YANDEX.NUMBER
$Unit: $time_unit
slots:
    amount:
        type: YANDEX.NUMBER
        source: $Amount
    unit:
        type: time_unit
        source: $Unit
"""
[intents.runtime]
kind = "control"
action = "seek_forward"
[[intents.runtime.mapping]]
field = "value"
from_slot = "amount"
reject_if_below = 1
cap = 86400
[[intents.runtime.mapping.multiply_when]]
slot = "unit"
equals = "minutes"
factor = 60

[[intents]]
form_name = "control.seek_back"
human_readable_name = "Перемотать назад"
positive_tests = """
перемотай назад на 30 секунд
перемотай назад на 1 минуту
назад 15 секунд
"""
negative_tests = """
вперёд 30 секунд
"""
grammar = """
root:
    %lemma
    назад [на] $Amount [$Unit] | перемотать назад [на] $Amount [$Unit]
$Amount: $YANDEX.NUMBER
$Unit: $time_unit
slots:
    amount:
        type: YANDEX.NUMBER
        source: $Amount
    unit:
        type: time_unit
        source: $Unit
"""
[intents.runtime]
kind = "control"
action = "seek_back"
[[intents.runtime.mapping]]
field = "value"
from_slot = "amount"
reject_if_below = 1
cap = 86400
[[intents.runtime.mapping.multiply_when]]
slot = "unit"
equals = "minutes"
factor = 60


