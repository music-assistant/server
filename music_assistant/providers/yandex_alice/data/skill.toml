[[intents]]
form_name = "control.pause"
human_readable_name = "Пауза"
positive_tests = """
пауза
поставь на паузу
останови музыку
на паузу
"""
negative_tests = """
включи
следующая
"""
grammar = """
root:
    %lemma
    пауза | поставь на паузу | останови музыку | на паузу
"""
[intents.runtime]
kind = "control"
action = "pause"

