<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #1a1a1a;
            --sidebar-bg: #212121;
            --surface: #2a2a2a;
            --text: #e0e0e0;
            --text-dim: #999;
            --text-menu: #bbb;
            --accent: #fff;
            --menu-active: #e0e0e0;
            --sidebar-w: 220px;
            --font: 'Outfit', -apple-system, 'Segoe UI', sans-serif;
            --lyrics-bottom-offset: 140px;
        }

        html, body {
            height: 100%; overflow: hidden;
            background: var(--bg); color: var(--text);
            font-family: var(--font); font-size: 15px;
        }

        /* --- Main layout: sidebar + content --- */
        #app {
            height: 100%; display: flex;
        }

        /* --- Sidebar --- */
        #sidebar {
            width: var(--sidebar-w); flex-shrink: 0;
            background: var(--sidebar-bg);
            display: flex; flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.06);
            z-index: 10;
        }

        #sidebar-header {
            padding: 24px 20px 18px;
            font-size: 1.15rem; font-weight: 600;
            color: var(--accent);
            letter-spacing: -0.01em;
        }

        #menu { list-style: none; flex: 1; padding: 0 8px; overflow-y: auto; }

        .menu-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 14px; margin: 2px 0;
            border-radius: 8px; cursor: pointer;
            color: var(--text-menu); font-size: 0.92rem;
            transition: background 0.15s, color 0.15s;
        }
        .menu-item:hover { background: rgba(255,255,255,0.06); color: var(--text); }
        .menu-item.active { background: rgba(255,255,255,0.1); color: var(--accent); font-weight: 500; }
        .menu-item .material-symbols-rounded { font-size: 20px; opacity: 0.7; }
        .menu-item.active .material-symbols-rounded { opacity: 1; }

        /* --- Right panel --- */
        #main {
            flex: 1; display: flex; flex-direction: column;
            min-width: 0; position: relative;
        }

        /* Content header with back button */
        #content-header {
            display: none; align-items: center; gap: 12px;
            padding: 12px 20px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        #content-header.visible { display: flex; }

        #btn-back {
            width: 32px; height: 32px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.08); color: var(--text);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.15s;
        }
        #btn-back:hover { background: rgba(255,255,255,0.15); }
        #btn-back .material-symbols-rounded { font-size: 20px; }

        #content-title {
            flex: 1; font-size: 0.95rem; font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* --- Content area --- */
        #content {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            padding: 16px 20px;
        }
        #content::-webkit-scrollbar { width: 6px; }
        #content::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        /* Grid (albums, artists, playlists) */
        .content-grid {
            display: grid;
            grid-template-columns: repeat(var(--cols, 4), 1fr);
            gap: 16px;
        }

        .card {
            cursor: pointer; border-radius: 8px;
            background: var(--surface); overflow: hidden;
            transition: transform 0.15s, background 0.15s;
            animation: fadeIn 0.3s ease both;
        }
        .card:hover { transform: scale(1.02); background: #333; }
        .card:active { transform: scale(0.98); }

        .card-img { aspect-ratio: 1; overflow: hidden; background: #333; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card-img--empty {
            display: flex; align-items: center; justify-content: center;
            color: var(--text-dim); font-size: 2rem;
        }
        .card-body { padding: 10px 12px; }
        .card-title {
            font-weight: 500; font-size: 0.88rem;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .card-sub {
            color: var(--text-dim); font-size: 0.78rem; margin-top: 3px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* Track list */
        .track-list { display: flex; flex-direction: column; }

        .track-row {
            display: flex; align-items: center; gap: 12px;
            padding: 8px 12px; border-radius: 6px;
            cursor: pointer; transition: background 0.12s;
            animation: fadeIn 0.25s ease both;
        }
        .track-row:hover { background: rgba(255,255,255,0.06); }
        .track-row:active { background: rgba(255,255,255,0.1); }

        .track-art {
            width: 48px; height: 48px; border-radius: 4px;
            object-fit: cover; background: #333; flex-shrink: 0;
        }
        .track-art--empty {
            width: 48px; height: 48px; border-radius: 4px;
            background: #333; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-dim); font-size: 1.2rem;
        }
        .track-info { flex: 1; min-width: 0; }
        .track-title {
            font-weight: 500; font-size: 0.9rem; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .track-sub {
            color: var(--text-dim); font-size: 0.8rem; margin-top: 2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* --- Player bar --- */
        #player-bar {
            display: none; align-items: center; gap: 14px;
            padding: 10px 20px;
            background: #181818;
            border-top: 1px solid rgba(255,255,255,0.08);
            z-index: 20;
        }
        #player-bar.active { display: flex; }

        #player-art { width: 44px; height: 44px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }

        #bar-info { flex: 1; min-width: 0; cursor: pointer; }
        #bar-title { font-weight: 500; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #bar-artist { color: var(--text-dim); font-size: 0.78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .controls { display: flex; align-items: center; gap: 6px; }
        .ctrl {
            width: 36px; height: 36px; border-radius: 50%; border: none;
            background: transparent; color: var(--text); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.12s, color 0.12s;
        }
        .ctrl:hover { background: rgba(255,255,255,0.1); }
        .ctrl--primary { width: 40px; height: 40px; background: #fff; color: #1a1a1a; }
        .ctrl--primary:hover { background: #ddd; color: #1a1a1a; }

        .progress { display: flex; align-items: center; gap: 8px; }
        .time { color: var(--text-dim); font-size: 0.72rem; font-variant-numeric: tabular-nums; min-width: 32px; }

        input[type="range"] {
            -webkit-appearance: none; appearance: none;
            width: 120px; height: 3px;
            background: rgba(255,255,255,0.15); border-radius: 2px; outline: none; cursor: pointer;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 12px; height: 12px;
            border-radius: 50%; background: #fff; border: none;
        }

        /* --- Full player (normal mode) --- */
        #player-full {
            position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 30;
            display: flex;
            background: #111;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #player-full.active { opacity: 1; pointer-events: auto; }

        /* Left panel: album art + track info + controls */
        .full-left {
            flex: 0 0 50%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 40px;
            position: relative;
        }

        #full-art {
            width: min(38vw, 38vh); height: min(38vw, 38vh);
            border-radius: 8px; object-fit: cover;
            box-shadow: 0 16px 48px rgba(0,0,0,0.5); margin-bottom: 24px;
        }
        #full-title { font-size: 1.2rem; font-weight: 600; text-align: center; max-width: 80%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #full-artist { color: var(--text-dim); font-size: 0.9rem; margin-top: 4px; text-align: center; }

        .full-progress { display: flex; align-items: center; gap: 12px; margin-top: 24px; width: min(40vw, 380px); }
        .full-progress input[type="range"] { flex: 1; height: 4px; }
        .full-progress .time { font-size: 0.8rem; min-width: 38px; }

        .full-controls { display: flex; align-items: center; gap: 20px; margin-top: 20px; }
        .full-controls .ctrl { width: 48px; height: 48px; }
        .full-controls .ctrl--primary { width: 56px; height: 56px; }
        .full-controls .ctrl .material-symbols-rounded { font-size: 26px; }
        .full-controls .ctrl--primary .material-symbols-rounded { font-size: 32px; }

        #full-browse {
            margin-top: 28px; padding: 8px 24px;
            border: 1px solid rgba(255,255,255,0.15); background: transparent;
            color: var(--text-dim); border-radius: 20px; cursor: pointer;
            font-family: var(--font); font-size: 0.82rem;
            transition: border-color 0.2s, color 0.2s;
        }
        #full-browse:hover { border-color: #fff; color: #fff; }

        /* Right panel: queue */
        .full-right {
            flex: 0 0 50%;
            display: flex; flex-direction: column;
            background: rgba(255,255,255,0.03);
            border-left: 1px solid rgba(255,255,255,0.06);
        }

        .queue-header {
            padding: 24px 24px 16px;
            font-size: 0.85rem; font-weight: 600;
            color: var(--text-dim);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .queue-list {
            flex: 1; overflow-y: auto; padding: 8px 12px;
        }
        .queue-list::-webkit-scrollbar { width: 5px; }
        .queue-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

        .queue-item {
            display: flex; align-items: center; gap: 12px;
            padding: 8px 12px; border-radius: 6px;
            cursor: pointer; transition: background 0.12s;
        }
        .queue-item:hover { background: rgba(255,255,255,0.06); }
        .queue-item.active { background: rgba(255,255,255,0.08); }

        .queue-item-num {
            width: 24px; text-align: center;
            font-size: 0.78rem; color: var(--text-dim);
            font-variant-numeric: tabular-nums; flex-shrink: 0;
        }
        .queue-item.active .queue-item-num {
            color: #4caf50;
        }

        .queue-item-art {
            width: 40px; height: 40px; border-radius: 4px;
            object-fit: cover; background: #333; flex-shrink: 0;
        }
        .queue-item-art--empty {
            width: 40px; height: 40px; border-radius: 4px;
            background: #333; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-dim); font-size: 1rem;
        }

        .queue-item-info { flex: 1; min-width: 0; }
        .queue-item-title {
            font-size: 0.85rem; font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .queue-item.active .queue-item-title { color: #4caf50; }
        .queue-item-sub {
            color: var(--text-dim); font-size: 0.75rem; margin-top: 1px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .queue-item-dur {
            font-size: 0.75rem; color: var(--text-dim);
            font-variant-numeric: tabular-nums; flex-shrink: 0;
        }

        .queue-empty {
            padding: 40px 20px; text-align: center;
            color: var(--text-dim); font-size: 0.9rem;
        }

        /* --- Search overlay --- */
        #search-overlay {
            position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 40;
            background: rgba(0,0,0,0.75); backdrop-filter: blur(8px);
            display: flex; align-items: flex-start; justify-content: center;
            padding-top: 12vh;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        #search-overlay.active { opacity: 1; pointer-events: auto; }

        .search-box { width: min(88vw, 460px); position: relative; }
        #search-input {
            width: 100%; padding: 14px 46px 14px 18px;
            background: #2a2a2a; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; color: var(--text);
            font-family: var(--font); font-size: 1rem; outline: none;
        }
        #search-input:focus { border-color: rgba(255,255,255,0.3); }
        #search-input::placeholder { color: var(--text-dim); }
        #search-close {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            width: 34px; height: 34px; border-radius: 50%; border: none;
            background: transparent; color: var(--text-dim); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* --- Loading --- */
        #loading {
            position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 50;
            display: flex; align-items: center; justify-content: center;
            background: rgba(26,26,26,0.5);
            opacity: 0; pointer-events: none; transition: opacity 0.15s;
        }
        #loading.active { opacity: 1; pointer-events: auto; }
        .spinner {
            width: 32px; height: 32px;
            border: 3px solid rgba(255,255,255,0.1); border-top-color: #fff;
            border-radius: 50%; animation: spin 0.7s linear infinite;
        }

        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 0.95rem; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* =============================================
           KIOSK MODE — Immersive Full-Screen
           ============================================= */
        body.kiosk-mode {
            background: #000;
            cursor: none;
        }
        body.kiosk-mode.controls-visible {
            cursor: default;
        }

        body.kiosk-mode #app {
            display: block;
        }

        body.kiosk-mode #sidebar,
        body.kiosk-mode #main,
        body.kiosk-mode #player-bar,
        body.kiosk-mode #player-full,
        body.kiosk-mode #search-overlay {
            display: none !important;
        }

        /* Kiosk player container — full-screen three-column layout */
        #kiosk-player {
            display: none;
            position: fixed;
            top: 0; right: 0; bottom: 0; left: 0;
            overflow: hidden;
            background: #000;
        }

        body.kiosk-mode #kiosk-player {
            display: flex;
        }

        /* Layer 1: Full-bleed background (behind columns) */
        #kiosk-bg {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            z-index: 0;
        }

        #kiosk-bg-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: blur(20px) brightness(0.50) saturate(1.3);
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        /* Vignette overlay */
        #kiosk-bg::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.35) 0%,
                transparent 35%,
                transparent 55%,
                rgba(0,0,0,0.70) 100%
            );
            pointer-events: none;
        }

        /* === Three-Column Layout === */
        .kiosk-col-left,
        .kiosk-col-center,
        .kiosk-col-right {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Left column: album art */
        .kiosk-col-left {
            flex: 0 0 30%;
            padding: 80px 20px 160px;
        }

        /* Center column: lyrics or equalizer */
        .kiosk-col-center {
            flex: 1;
            padding: 10px 10px 160px;
            min-width: 0;
            justify-content: center;
            position: relative;
        }

        /* Right column: queue */
        .kiosk-col-right {
            flex: 0 0 28%;
            padding: 24px 0 160px;
            justify-content: flex-start;
            align-items: stretch;
        }

        /* Album art in left column */
        #kiosk-art-center {
            max-width: 90%;
            max-height: 50vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.65);
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
        }
        #kiosk-player.playing #kiosk-art-center {
            opacity: 1;
        }

        /* Track info under album art */
        .kiosk-track-info {
            margin-top: 24px;
            text-align: center;
            max-width: 90%;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        #kiosk-player.playing .kiosk-track-info {
            opacity: 1;
        }

        #kiosk-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 12px rgba(0,0,0,0.6);
        }
        #kiosk-artist {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.7);
            margin-top: 6px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* Layer 2: Idle state */
        #kiosk-idle {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            opacity: 1;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 3;
        }
        #kiosk-idle .material-symbols-rounded {
            font-size: 96px;
            color: rgba(255,255,255,0.15);
        }
        #kiosk-idle-label {
            font-size: 1rem;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.05em;
        }

        /* Hide idle when playing */
        #kiosk-player.playing #kiosk-idle {
            opacity: 0;
        }

        /* Layer 3: Sync indicator (top-right) */
        #kiosk-sync-status {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            color: #fff;
            background: rgba(255, 152, 0, 0.9);
            z-index: 10;
        }
        .sync-indicator.synced {
            background: rgba(76, 175, 80, 0.9);
        }
        .sync-indicator.syncing {
            background: rgba(255, 152, 0, 0.9);
            animation: pulse 1.5s infinite;
        }
        .sync-indicator.error {
            background: rgba(244, 67, 54, 0.9);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Party QR overlay (top-left) */
        #kiosk-party {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            max-width: 180px;
        }
        #kiosk-party[hidden] { display: none; }
        #kiosk-party-qr {
            display: block;
            width: 140px;
            height: 140px;
            margin: 0 auto;
            padding: 6px;
            background: #fff;
            border-radius: 8px;
        }
        #kiosk-party-name {
            margin-top: 8px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }
        #kiosk-party-text {
            margin-top: 2px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }

        /* === Karaoke lyrics (center column) === */
        #kiosk-lyrics {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-bottom: var(--lyrics-bottom-offset);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        #kiosk-player.has-lyrics #kiosk-lyrics {
            opacity: 1;
        }

        #kiosk-lyrics-scroll {
            width: 100%;
            max-width: 700px;
            max-height: calc(100% - var(--lyrics-bottom-offset));
            overflow: hidden;
            -webkit-mask-image: linear-gradient(transparent 0%, black 10%, black 85%, transparent 100%);
            mask-image: linear-gradient(transparent 0%, black 10%, black 85%, transparent 100%);
            position: relative;
        }

        #kiosk-lyrics-inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            transition: transform 0.55s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        .lyric-line {
            font-size: 1.35rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.38);
            text-align: center;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9), 0 0 40px rgba(0, 0, 0, 0.7);
            transition: color 0.35s ease, font-size 0.35s ease, font-weight 0.35s ease;
            line-height: 1.5;
            max-width: 100%;
            word-break: break-word;
        }
        .lyric-line.lp1 { color: rgba(255, 255, 255, 0.60); font-size: 1.45rem; }
        .lyric-line.active {
            color: #ffffff;
            font-size: 1.75rem;
            font-weight: 700;
            text-shadow: 0 2px 16px rgba(0, 0, 0, 0.95), 0 0 60px rgba(0, 0, 0, 0.6);
        }
        .lyric-line.ln1 { color: rgba(255, 255, 255, 0.55); font-size: 1.45rem; }

        /* Plain text (no LRC): static */
        #kiosk-player.has-lyrics.plain-lyrics #kiosk-lyrics-inner {
            transition: none;
        }
        #kiosk-player.has-lyrics.plain-lyrics .lyric-line {
            color: rgba(255, 255, 255, 0.80);
            font-size: 1.1rem;
            font-weight: 400;
            gap: 10px;
        }

        /* === CSS Text Equalizer (center column, when no lyrics) === */
        #kiosk-equalizer {
            position: absolute;
            top: 0; right: 0; bottom: 0; left: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
        #kiosk-player.playing:not(.has-lyrics) #kiosk-equalizer {
            opacity: 1;
        }

        .eq-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 6px;
            height: 50vh;
            max-height: 400px;
            padding: 20px;
        }

        .eq-bar {
            width: 8px;
            border-radius: 4px;
            background: linear-gradient(to top, rgba(76,175,80,0.9), rgba(129,199,132,0.7), rgba(200,230,201,0.5));
            animation: eqBounce var(--eq-dur, 1s) var(--eq-delay, 0s) ease-in-out infinite alternate;
            will-change: height;
            min-height: 8px;
        }

        @keyframes eqBounce {
            0%   { height: var(--eq-min, 8px); opacity: 0.5; }
            100% { height: var(--eq-max, 100px); opacity: 1; }
        }

        /* Pause equalizer animation when not playing */
        #kiosk-player:not(.playing) .eq-bar {
            animation-play-state: paused;
        }

        /* === Kiosk Queue (right column) === */
        .kiosk-queue-header {
            padding: 20px 20px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255,255,255,0.5);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        #kiosk-queue-list {
            flex: 1;
            overflow-y: auto;
            padding: 6px 8px;
        }
        #kiosk-queue-list::-webkit-scrollbar { width: 4px; }
        #kiosk-queue-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

        .kiosk-queue-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 7px 10px;
            border-radius: 6px;
            transition: background 0.12s;
        }
        .kiosk-queue-item:hover { background: rgba(255,255,255,0.06); }
        .kiosk-queue-item.active { background: rgba(255,255,255,0.08); }

        .kiosk-queue-num {
            width: 22px;
            text-align: center;
            font-size: 0.72rem;
            color: rgba(255,255,255,0.4);
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }
        .kiosk-queue-item.active .kiosk-queue-num { color: #4caf50; }

        .kiosk-queue-art {
            width: 36px; height: 36px;
            border-radius: 4px;
            object-fit: cover;
            background: rgba(255,255,255,0.05);
            flex-shrink: 0;
        }
        .kiosk-queue-art--empty {
            width: 36px; height: 36px;
            border-radius: 4px;
            background: rgba(255,255,255,0.05);
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.3);
        }

        .kiosk-queue-info { flex: 1; min-width: 0; }
        .kiosk-queue-title {
            font-size: 0.82rem;
            font-weight: 500;
            color: rgba(255,255,255,0.85);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .kiosk-queue-item.active .kiosk-queue-title { color: #4caf50; }
        .kiosk-queue-sub {
            color: rgba(255,255,255,0.4);
            font-size: 0.72rem;
            margin-top: 1px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .kiosk-queue-dur {
            font-size: 0.72rem;
            color: rgba(255,255,255,0.35);
            font-variant-numeric: tabular-nums;
            flex-shrink: 0;
        }

        .kiosk-queue-empty {
            padding: 40px 16px;
            text-align: center;
            color: rgba(255,255,255,0.3);
            font-size: 0.85rem;
        }

        /* Layer 5: Auto-hiding controls panel (bottom) */
        #kiosk-controls-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 28px 40px 36px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(0, 0, 0, 0.75);
            background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, transparent 100%);
            transform: translateY(0);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
        }
        #kiosk-player.controls-hidden #kiosk-controls-panel {
            transform: translateY(100%);
        }

        /* Seek row */
        .kiosk-seek-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }
        .kiosk-seek-row .time {
            font-size: 0.82rem;
            color: rgba(255,255,255,0.6);
            font-variant-numeric: tabular-nums;
            min-width: 40px;
        }
        #kiosk-seek {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
        }
        #kiosk-seek::-webkit-slider-thumb {
            width: 14px;
            height: 14px;
        }

        /* Controls row */
        .kiosk-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
        }
        .kiosk-controls .ctrl {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.85);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, color 0.15s, transform 0.15s;
        }
        .kiosk-controls .ctrl:hover {
            background: rgba(255,255,255,0.12);
            color: #fff;
        }
        .kiosk-controls .ctrl:active {
            transform: scale(0.92);
        }
        .kiosk-controls .ctrl .material-symbols-rounded {
            font-size: 32px;
        }
        .kiosk-controls .ctrl--primary {
            width: 72px;
            height: 72px;
            background: rgba(255,255,255,0.95);
            color: #000;
        }
        .kiosk-controls .ctrl--primary:hover {
            background: #fff;
            color: #000;
        }
        .kiosk-controls .ctrl--primary .material-symbols-rounded {
            font-size: 40px;
        }

        /* --- Responsive --- */
        @media (max-width: 900px) {
            .content-grid { --cols: 3 !important; }
            #player-full { flex-direction: column; }
            .full-left { flex: 0 0 auto; padding: 24px; }
            .full-right { flex: 1; min-height: 0; border-left: none; border-top: 1px solid rgba(255,255,255,0.06); }
            #full-art { width: min(35vw, 200px); height: min(35vw, 200px); margin-bottom: 16px; }
            .full-progress { width: 80%; }

            /* Kiosk: hide queue column on narrow screens */
            .kiosk-col-right { display: none; }
            .kiosk-col-left { flex: 0 0 35%; }
            .kiosk-col-center { flex: 1; }
        }
        @media (max-width: 640px) {
            :root { --sidebar-w: 180px; }
            .content-grid { --cols: 2 !important; gap: 10px; }
            #content { padding: 12px; }
            .progress { display: none; }
            .full-left { padding: 16px; }
            #full-art { width: min(30vw, 160px); height: min(30vw, 160px); margin-bottom: 12px; }
            #full-title { font-size: 1rem; }
            .full-controls { gap: 12px; margin-top: 12px; }
            .full-progress { margin-top: 16px; }
            #full-browse { margin-top: 16px; }

            /* Kiosk: single column on mobile */
            .kiosk-col-left { flex: 0 0 100%; }
            .kiosk-col-center { display: none; }
            .kiosk-col-right { display: none; }
            #kiosk-title { font-size: 1.1rem; }
            #kiosk-artist { font-size: 0.85rem; }
            #kiosk-controls-panel { padding: 20px 20px 28px; }
            .kiosk-controls .ctrl { width: 48px; height: 48px; }
            .kiosk-controls .ctrl--primary { width: 60px; height: 60px; }
            .lyric-line { font-size: 1.1rem; }
            .lyric-line.active { font-size: 1.4rem; }
            .lyric-line.lp1, .lyric-line.ln1 { font-size: 1.2rem; }
        }
        @media (min-width: 1920px) {
            html, body { font-size: 20px; }
            .lyric-line { font-size: 1.8rem; }
            .lyric-line.active { font-size: 2.2rem; }
            #kiosk-title { font-size: 1.7rem; }
            #kiosk-artist { font-size: 1.2rem; }
            .kiosk-queue-title { font-size: 1rem; }
            .kiosk-controls .ctrl { width: 72px; height: 72px; }
            .kiosk-controls .ctrl--primary { width: 90px; height: 90px; }
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Sidebar (normal mode only) -->
        <nav id="sidebar">
            <div id="sidebar-header">Music Assistant</div>
            <ul id="menu"></ul>
        </nav>

        <!-- Right panel (normal mode only) -->
        <div id="main">
            <div id="content-header">
                <button id="btn-back"><span class="material-symbols-rounded">arrow_back</span></button>
                <div id="content-title"></div>
            </div>
            <div id="content"></div>
            <footer id="player-bar">
                <img id="player-art" src="" alt="">
                <div id="bar-info">
                    <div id="bar-title"></div>
                    <div id="bar-artist"></div>
                </div>
                <div class="controls">
                    <button id="btn-prev" class="ctrl"><span class="material-symbols-rounded">skip_previous</span></button>
                    <button id="btn-play" class="ctrl ctrl--primary"><span class="material-symbols-rounded">play_arrow</span></button>
                    <button id="btn-next" class="ctrl"><span class="material-symbols-rounded">skip_next</span></button>
                </div>
                <div class="progress">
                    <span id="bar-time" class="time">0:00</span>
                    <input type="range" id="bar-seek" min="0" max="100" value="0" step="0.1">
                    <span id="bar-dur" class="time">0:00</span>
                </div>
            </footer>
        </div>

        <!-- Full-screen player (normal mode only) -->
        <div id="player-full">
            <!-- Left: album art + info + controls -->
            <div class="full-left">
                <img id="full-art" src="" alt="">
                <div id="full-title"></div>
                <div id="full-artist"></div>
                <div class="full-progress">
                    <span id="full-time" class="time">0:00</span>
                    <input type="range" id="full-seek" min="0" max="100" value="0" step="0.1">
                    <span id="full-dur" class="time">0:00</span>
                </div>
                <div class="full-controls">
                    <button id="full-prev" class="ctrl"><span class="material-symbols-rounded">skip_previous</span></button>
                    <button id="full-play" class="ctrl ctrl--primary"><span class="material-symbols-rounded">play_arrow</span></button>
                    <button id="full-next" class="ctrl"><span class="material-symbols-rounded">skip_next</span></button>
                </div>
                <button id="full-browse">Browse Library</button>
            </div>
            <!-- Right: playback queue -->
            <div class="full-right">
                <div class="queue-header">Queue</div>
                <div id="queue-list" class="queue-list">
                    <div class="queue-empty">No tracks in queue</div>
                </div>
            </div>
        </div>

        <!-- Kiosk player (kiosk mode only) — three-column layout -->
        <div id="kiosk-player">
            <!-- Background layer (behind columns) -->
            <div id="kiosk-bg">
                <img id="kiosk-bg-img" src="" alt="" aria-hidden="true">
            </div>

            <!-- Idle state overlay (nothing playing) -->
            <div id="kiosk-idle">
                <span class="material-symbols-rounded">music_note</span>
                <div id="kiosk-idle-label">Waiting for playback...</div>
            </div>

            <!-- Sync indicator (Sendspin, top-right) -->
            <div id="kiosk-sync-status" class="sync-indicator">CONNECTING...</div>

            <!-- Party QR overlay (shown when the MA Party plugin has guest access enabled) -->
            <div id="kiosk-party" hidden>
                <img id="kiosk-party-qr" src="" alt="Party join QR code">
                <div id="kiosk-party-name"></div>
                <div id="kiosk-party-text"></div>
            </div>

            <!-- Left column: album art + track info -->
            <div class="kiosk-col-left">
                <img id="kiosk-art-center" src="" alt="" aria-hidden="true">
                <div class="kiosk-track-info">
                    <div id="kiosk-title"></div>
                    <div id="kiosk-artist"></div>
                </div>
            </div>

            <!-- Center column: lyrics or CSS equalizer -->
            <div class="kiosk-col-center">
                <!-- Karaoke lyrics -->
                <div id="kiosk-lyrics">
                    <div id="kiosk-lyrics-scroll">
                        <div id="kiosk-lyrics-inner"></div>
                    </div>
                </div>
                <!-- CSS text equalizer (shown when no lyrics) -->
                <div id="kiosk-equalizer">
                    <div class="eq-container" id="eq-bars"></div>
                </div>
            </div>

            <!-- Right column: playback queue -->
            <div class="kiosk-col-right">
                <div class="kiosk-queue-header">Queue</div>
                <div id="kiosk-queue-list">
                    <div class="kiosk-queue-empty">No tracks in queue</div>
                </div>
            </div>

            <!-- Auto-hiding controls panel (bottom, overlays all columns) -->
            <div id="kiosk-controls-panel">
                <div class="kiosk-seek-row">
                    <span id="kiosk-time" class="time">0:00</span>
                    <input type="range" id="kiosk-seek" min="0" max="100" value="0" step="0.1" disabled>
                    <span id="kiosk-dur" class="time">0:00</span>
                </div>
                <div class="kiosk-controls">
                    <button id="kiosk-prev" class="ctrl"><span class="material-symbols-rounded">skip_previous</span></button>
                    <button id="kiosk-play" class="ctrl ctrl--primary"><span class="material-symbols-rounded">play_arrow</span></button>
                    <button id="kiosk-next" class="ctrl"><span class="material-symbols-rounded">skip_next</span></button>
                </div>
            </div>
        </div>

        <!-- Search overlay -->
        <div id="search-overlay">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search music...">
                <button id="search-close"><span class="material-symbols-rounded">close</span></button>
            </div>
        </div>

        <div id="loading"><div class="spinner"></div></div>
    </div>

    <audio id="audio" preload="none"></audio>
    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            if (params.get('kiosk') === '1') {
                document.body.classList.add('kiosk-mode');
            }
        })();
    </script>
    <script type="module" src="/web/web.js?v=7"></script>
</body>
</html>
