<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Music Assistant</title>
    <style>
        :root {
            --fg: #000000;
            --background: #f5f5f5;
            --overlay: #e7e7e7;
            --panel: #ffffff;
            --default: #ffffff;
            --primary: #03a9f4;
            --text-secondary: rgba(0, 0, 0, 0.6);
            --text-tertiary: rgba(0, 0, 0, 0.4);
            --border: rgba(0, 0, 0, 0.1);
            --input-bg: rgba(0, 0, 0, 0.03);
            --input-focus-bg: rgba(3, 169, 244, 0.05);
            --primary-glow: rgba(3, 169, 244, 0.15);
            --error-bg: rgba(244, 67, 54, 0.08);
            --error-border: rgba(244, 67, 54, 0.2);
            --error-text: #d32f2f;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --fg: #ffffff;
                --background: #181818;
                --overlay: #181818;
                --panel: #232323;
                --default: #000000;
                --text-secondary: rgba(255, 255, 255, 0.7);
                --text-tertiary: rgba(255, 255, 255, 0.4);
                --border: rgba(255, 255, 255, 0.08);
                --input-bg: rgba(255, 255, 255, 0.05);
                --input-focus-bg: rgba(3, 169, 244, 0.08);
                --primary-glow: rgba(3, 169, 244, 0.25);
                --error-bg: rgba(244, 67, 54, 0.1);
                --error-border: rgba(244, 67, 54, 0.25);
                --error-text: #ff6b6b;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--background);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--fg);
        }

        .login-container {
            background: var(--panel);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12),
                        0 0 0 1px var(--border);
            width: 100%;
            max-width: 400px;
            padding: 48px 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo img {
            width: 72px;
            height: 72px;
            object-fit: contain;
        }

        h1 {
            text-align: center;
            color: var(--fg);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-tertiary);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .error {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            padding: 14px 16px;
            border-radius: 10px;
            margin-bottom: 22px;
            font-size: 13px;
            display: none;
        }

        .error.show {
            display: block;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: var(--fg);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: 0.2px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            color: var(--fg);
            transition: all 0.2s ease;
        }

        input[type="text"]::placeholder,
        input[type="password"]::placeholder {
            color: var(--text-tertiary);
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--input-focus-bg);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
            margin-bottom: 12px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            filter: brightness(1.1);
            box-shadow: 0 8px 24px var(--primary-glow);
            transform: translateY(-1px);
        }

        .btn-primary:active {
            transform: translateY(0);
            filter: brightness(0.95);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            filter: none;
        }

        .btn-secondary {
            background: var(--input-bg);
            color: var(--fg);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-secondary:hover {
            background: var(--input-focus-bg);
            border-color: var(--primary);
        }

        .divider {
            text-align: center;
            margin: 28px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border);
        }

        .divider span {
            background: var(--panel);
            padding: 0 16px;
            color: var(--text-tertiary);
            font-size: 13px;
            position: relative;
        }

        .oauth-providers {
            margin-top: 8px;
        }

        .provider-icon {
            width: 20px;
            height: 20px;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <img src="./logo.png" alt="Music Assistant">
        </div>

        <h1>Music Assistant</h1>
        <p class="subtitle">Sign in to continue</p>

        <div id="error" class="error"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>

            <button type="submit" class="btn btn-primary" id="loginBtn">
                <span id="loginText">Sign In</span>
                <span id="loginLoading" class="loading" style="display: none;"></span>
            </button>
        </form>

        <div id="oauthProviders" class="oauth-providers">
            <!-- OAuth providers will be inserted here -->
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        // Get return_url and device_name from query string
        const urlParams = new URLSearchParams(window.location.search);
        const returnUrl = urlParams.get('return_url');
        const deviceName = urlParams.get('device_name');

        // Show error message
        function showError(message) {
            const errorEl = document.getElementById('error');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        // Hide error message
        function hideError() {
            document.getElementById('error').classList.remove('show');
        }

        // Set loading state
        function setLoading(loading) {
            const btn = document.getElementById('loginBtn');
            const text = document.getElementById('loginText');
            const loadingEl = document.getElementById('loginLoading');

            btn.disabled = loading;
            text.style.display = loading ? 'none' : 'inline';
            loadingEl.style.display = loading ? 'inline-block' : 'none';
        }

        // Load OAuth providers
        async function loadProviders() {
            try {
                const response = await fetch(`${API_BASE}/auth/providers`);
                const providers = await response.json();

                const oauthProviders = providers.filter(p => p.requires_redirect && p.provider_type !== 'builtin');

                if (oauthProviders.length > 0) {
                    const container = document.getElementById('oauthProviders');

                    // Add divider
                    const divider = document.createElement('div');
                    divider.className = 'divider';
                    divider.innerHTML = '<span>Or continue with</span>';
                    container.appendChild(divider);

                    // Add OAuth buttons
                    oauthProviders.forEach(provider => {
                        const btn = document.createElement('button');
                        btn.className = 'btn btn-secondary';
                        btn.type = 'button';

                        let providerName = provider.provider_type;
                        if (provider.provider_type === 'homeassistant') {
                            providerName = 'Home Assistant';
                        } else if (provider.provider_type === 'google') {
                            providerName = 'Google';
                        }

                        btn.innerHTML = `<span>Sign in with ${providerName}</span>`;
                        btn.onclick = () => initiateOAuth(provider.provider_id);

                        container.appendChild(btn);
                    });
                }
            } catch (error) {
                console.error('Failed to load providers:', error);
            }
        }

        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();
            setLoading(true);

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const requestBody = {
                    provider_id: 'builtin',
                    credentials: { username, password }
                };

                // Include device_name if provided via query parameter
                if (deviceName) {
                    requestBody.device_name = deviceName;
                }

                // Include return_url if present
                if (returnUrl) {
                    requestBody.return_url = returnUrl;
                }

                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();

                if (data.success) {
                    // If return_url is provided, redirect to it with token as query parameter
                    if (returnUrl) {
                        const targetUrl = new URL(returnUrl);
                        targetUrl.searchParams.set('token', data.token);
                        window.location.href = targetUrl.toString();
                    } else {
                        // No return_url, redirect to root with token as query parameter
                        window.location.href = `/?token=${encodeURIComponent(data.token)}`;
                    }
                } else {
                    showError(data.error || 'Login failed');
                }
            } catch (error) {
                showError('Network error. Please try again.');
            } finally {
                setLoading(false);
            }
        });

        // Initiate OAuth flow
        async function initiateOAuth(providerId) {
            try {
                // Include provider_id in callback URL
                let authorizeUrl = `${API_BASE}/auth/authorize?provider_id=${providerId}`;

                // Pass return_url to authorize endpoint if present
                if (returnUrl) {
                    authorizeUrl += `&return_url=${encodeURIComponent(returnUrl)}`;
                }

                const response = await fetch(authorizeUrl);
                const data = await response.json();

                if (data.authorization_url) {
                    // Open OAuth flow in popup window
                    const width = 600;
                    const height = 700;
                    const left = (screen.width - width) / 2;
                    const top = (screen.height - height) / 2;
                    const popup = window.open(
                        data.authorization_url,
                        'oauth_popup',
                        `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`
                    );

                    if (!popup) {
                        showError('Failed to open popup. Please allow popups for this site.');
                    }
                } else {
                    showError('Failed to initiate OAuth flow');
                }
            } catch (error) {
                showError('Network error. Please try again.');
            }
        }

        // Listen for OAuth success messages from popup window
        window.addEventListener('message', (event) => {
            // Verify message is from our origin
            if (event.origin !== window.location.origin) {
                return;
            }

            // Check if it's an OAuth success message
            if (event.data && event.data.type === 'oauth_success' && event.data.token) {
                // Store token in localStorage
                localStorage.setItem('auth_token', event.data.token);

                // Redirect to the URL from OAuth callback
                const redirectUrl = event.data.redirectUrl || `/?token=${encodeURIComponent(event.data.token)}`;
                window.location.href = redirectUrl;
            }
        });

        // Clear error on input
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', hideError);
        });

        // Load providers on page load
        loadProviders();
    </script>
</body>
</html>
