<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Assistant - Initial Setup</title>
    <link rel="stylesheet" href="/resources/common.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .setup-container {
            background: var(--panel);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12),
                        0 0 0 1px var(--border);
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            margin-bottom: 36px;
        }

        .logo-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .logo h1 {
            color: var(--fg);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .logo p {
            color: var(--text-tertiary);
            font-size: 14px;
            font-weight: 400;
        }

        .info-box {
            background: var(--input-focus-bg);
            border-left: 3px solid var(--primary);
            padding: 16px 18px;
            margin-bottom: 28px;
            border-radius: 0 8px 8px 0;
        }

        .info-box h3 {
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .info-box p {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.6;
        }

        .password-requirements {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
            margin-top: 8px;
        }

        .submit-btn:hover {
            filter: brightness(1.1);
            box-shadow: 0 8px 24px var(--primary-glow);
            transform: translateY(-1px);
        }

        .submit-btn:active {
            transform: translateY(0);
            filter: brightness(0.95);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            filter: none;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 30px 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 2px solid var(--border);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading p {
            margin-top: 16px;
            color: var(--text-secondary);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="setup-container">
        <div class="logo">
            <div class="logo-icon">
                <img src="/logo.png" alt="Music Assistant">
            </div>
            <h1>Music Assistant</h1>
            <p>Initial Setup</p>
        </div>

        <div class="info-box">
            <h3>Welcome</h3>
            <p>Create your administrator account to get started. This account will have full access to manage Music Assistant.</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="setupForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    required
                    autocomplete="username"
                    placeholder="Enter your username"
                    minlength="3"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="new-password"
                    placeholder="Enter a secure password"
                    minlength="8"
                >
                <div class="password-requirements">
                    Minimum 8 characters recommended
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    required
                    autocomplete="new-password"
                    placeholder="Re-enter your password"
                >
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                Create Admin Account
            </button>
        </form>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Setting up your account...</p>
        </div>
    </div>

    <script>
        // Get query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const deviceName = urlParams.get('device_name');
        const returnUrl = urlParams.get('return_url');

        const form = document.getElementById('setupForm');
        const errorMessage = document.getElementById('errorMessage');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');

        // Check if this is an Ingress setup (variables injected by server)
        const isIngressSetup = typeof ingressUsername !== 'undefined' && ingressUsername;

        // Configure UI for Ingress setup
        if (isIngressSetup) {
            // Pre-fill and disable username field (provided by Home Assistant)
            const usernameField = document.getElementById('username');
            usernameField.value = ingressUsername;
            usernameField.disabled = true;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }

        function setLoading(isLoading) {
            if (isLoading) {
                form.style.display = 'none';
                loading.classList.add('show');
            } else {
                form.style.display = 'block';
                loading.classList.remove('show');
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Validation
            if (username.length < 3) {
                showError('Username must be at least 3 characters long');
                return;
            }

            if (password.length < 8) {
                showError('Password must be at least 8 characters long');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            setLoading(true);

            try {
                const requestBody = {
                    username: username,
                    password: password,
                };

                // Include device_name if provided via query parameter
                if (deviceName) {
                    requestBody.device_name = deviceName;
                }

                // Include Ingress context if applicable
                if (isIngressSetup) {
                    requestBody.from_ingress = true;
                    requestBody.display_name = ingressDisplayName;
                }

                const response = await fetch('setup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestBody),
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Redirect to return_url with token if provided
                    if (returnUrl) {
                        const targetUrl = new URL(returnUrl, window.location.origin);
                        targetUrl.searchParams.set('token', data.token);
                        window.location.href = targetUrl.toString();
                    } else {
                        // Store the token and redirect to main page
                        localStorage.setItem('auth_token', data.token);
                        window.location.href = '/';
                    }
                } else {
                    setLoading(false);
                    showError(data.error || 'Setup failed. Please try again.');
                }
            } catch (error) {
                setLoading(false);
                showError('Network error. Please check your connection and try again.');
                console.error('Setup error:', error);
            }
        });

        // Clear error on input
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', hideError);
        });
    </script>
</body>
</html>
