<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonic Analysis — Debug Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface-2: #1a1a26;
    --border: #2a2a3a;
    --text: #e0e0ea;
    --text-dim: #7a7a8e;
    --accent: #00e5a0;
    --accent-dim: #00e5a020;
    --warn: #ff6b6b;
    --info: #6bc5ff;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 9999;
  }

  header { border-bottom: 1px solid var(--border); padding: 1.5rem 2rem; display: flex; align-items: center; gap: 1rem; background: var(--surface); }
  header h1 { font-family: var(--mono); font-size: 1.1rem; font-weight: 700; letter-spacing: -0.02em; color: var(--accent); }
  header h1 span { color: var(--text-dim); font-weight: 400; }

  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-dim); transition: background 0.3s; }
  .status-dot.connected { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .status-dot.error { background: var(--warn); box-shadow: 0 0 8px var(--warn); }

  .connect-bar { display: flex; gap: 0.75rem; padding: 1rem 2rem; background: var(--surface-2); border-bottom: 1px solid var(--border); align-items: center; flex-wrap: wrap; }
  .connect-bar label { font-family: var(--mono); font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }

  input, select { font-family: var(--mono); font-size: 0.85rem; padding: 0.5rem 0.75rem; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); outline: none; transition: border-color 0.2s; }
  input:focus, select:focus { border-color: var(--accent); }
  input.host { width: 260px; }
  input.token { width: 340px; font-size: 0.75rem; }

  button { font-family: var(--mono); font-size: 0.8rem; font-weight: 600; padding: 0.5rem 1.2rem; border: 1px solid var(--accent); background: transparent; color: var(--accent); border-radius: 4px; cursor: pointer; transition: all 0.15s; text-transform: uppercase; letter-spacing: 0.05em; }
  button:hover { background: var(--accent); color: var(--bg); }
  button:active { transform: scale(0.97); }
  button.secondary { border-color: var(--border); color: var(--text-dim); }
  button.secondary:hover { border-color: var(--text-dim); color: var(--text); background: transparent; }

  main { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); min-height: calc(100vh - 120px); }
  .panel { background: var(--bg); padding: 1.5rem 2rem; display: flex; flex-direction: column; gap: 1rem; }
  .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
  .panel h2 { font-family: var(--mono); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.75rem; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; transition: border-color 0.2s; }
  .stat-card:hover { border-color: var(--accent); }
  .stat-label { font-family: var(--mono); font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim); margin-bottom: 0.4rem; }
  .stat-value { font-family: var(--mono); font-size: 1.6rem; font-weight: 700; color: var(--accent); line-height: 1; }
  .stat-value.warn { color: var(--warn); }
  .stat-value.info { color: var(--info); }
  .stat-value.dim { color: var(--text-dim); }

  .table-wrap { flex: 1; overflow: auto; border: 1px solid var(--border); border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 0.78rem; }
  thead { position: sticky; top: 0; z-index: 1; }
  th { background: var(--surface-2); padding: 0.6rem 0.75rem; text-align: left; font-weight: 600; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); border-bottom: 1px solid var(--border); }
  td { padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); color: var(--text); white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
  tr:hover td { background: var(--accent-dim); }

  .sim-form { display: flex; gap: 0.5rem; align-items: center; }
  .sim-form input { flex: 1; }

  .results-list { display: flex; flex-direction: column; gap: 0.5rem; flex: 1; overflow: auto; }
  .result-item { display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; transition: border-color 0.2s; }
  .result-item:hover { border-color: var(--accent); }
  .result-rank { font-family: var(--mono); font-size: 0.7rem; font-weight: 700; color: var(--text-dim); min-width: 28px; text-align: center; }
  .result-info { flex: 1; }
  .result-id { font-family: var(--mono); font-size: 0.8rem; font-weight: 600; color: var(--text); }
  .result-provider { font-size: 0.7rem; color: var(--text-dim); }
  .result-distance { font-family: var(--mono); font-size: 0.85rem; font-weight: 700; padding: 0.25rem 0.75rem; border-radius: 4px; min-width: 70px; text-align: center; }
  .dist-close { background: #00e5a018; color: var(--accent); }
  .dist-mid { background: #6bc5ff18; color: var(--info); }
  .dist-far { background: #ff6b6b18; color: var(--warn); }

  .log-area { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem; font-family: var(--mono); font-size: 0.72rem; line-height: 1.6; overflow: auto; max-height: 300px; color: var(--text-dim); }
  .empty-state { display: flex; align-items: center; justify-content: center; flex: 1; color: var(--text-dim); font-family: var(--mono); font-size: 0.85rem; min-height: 120px; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; }

  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header>
  <div class="status-dot" id="statusDot"></div>
  <h1>sonic_analysis <span>// debug console</span></h1>
</header>

<div class="connect-bar">
  <label>host</label>
  <input type="text" class="host" id="hostInput" placeholder="http://10.0.1.6:8095" value="http://10.0.1.6:8095">
  <label>token</label>
  <input type="password" class="token" id="tokenInput" placeholder="paste long-lived bearer token">
  <button onclick="connect()">Connect</button>
  <button class="secondary" onclick="refreshAll()">Refresh All</button>
</div>

<main>
  <div class="panel">
    <div class="panel-header">
      <h2>Index Status</h2>
      <button class="secondary" onclick="fetchStatus()">Refresh</button>
    </div>
    <div class="stats-grid" id="statsGrid"></div>
    <h2 style="margin-top:0.5rem">Activity Log</h2>
    <div class="log-area" id="logArea"></div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h2>Stored Signatures</h2>
      <div style="display:flex;gap:0.5rem;align-items:center">
        <button class="secondary" onclick="prevPage()">&lt;</button>
        <span id="pageInfo" style="font-family:var(--mono);font-size:0.75rem;color:var(--text-dim)"></span>
        <button class="secondary" onclick="nextPage()">&gt;</button>
        <button class="secondary" onclick="fetchSignatures()">Refresh</button>
      </div>
    </div>
    <div class="table-wrap" id="sigTableWrap">
      <table>
        <thead><tr><th>#</th><th>Item ID</th><th>Provider</th><th>Ver</th><th>Feat</th><th></th></tr></thead>
        <tbody id="sigBody"></tbody>
      </table>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header"><h2>Similarity Search</h2></div>
    <div class="sim-form">
      <input type="text" id="simInput" placeholder="Enter track item_id...">
      <input type="number" id="simLimit" value="10" min="1" max="100" style="width:70px">
      <button onclick="searchSimilar()">Search</button>
    </div>
    <div class="results-list" id="resultsList">
      <div class="empty-state">Enter a track ID to find similar tracks</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header"><h2>Raw API</h2></div>
    <div class="sim-form">
      <select id="apiEndpoint">
        <option value="/api/sonic_analysis/status">GET /status</option>
        <option value="/api/sonic_analysis/signatures">GET /signatures</option>
        <option value="/api/sonic_analysis/similar">GET /similar</option>
      </select>
      <input type="text" id="apiParams" placeholder="item_id=123&limit=10">
      <button onclick="rawApiCall()">Send</button>
    </div>
    <pre class="log-area" id="rawOutput" style="flex:1;white-space:pre-wrap;word-break:break-all;max-height:none"></pre>
  </div>
</main>

<script>
  // NOTE: This is a local-only debug tool, not a production UI.
  // All data rendered comes from authenticated API responses from our own server.
  // DOM construction uses safe methods (createElement, textContent) for user-provided
  // values. Template rendering of API data uses helper functions below.

  let HOST = '';
  let TOKEN = '';
  let sigPage = 0;
  const SIG_PAGE_SIZE = 50;

  function saveSettings() {
    localStorage.setItem('sa_host', HOST);
    localStorage.setItem('sa_token', TOKEN);
  }

  function loadSettings() {
    const h = localStorage.getItem('sa_host');
    const t = localStorage.getItem('sa_token');
    if (h) { HOST = h; document.getElementById('hostInput').value = h; }
    if (t) { TOKEN = t; document.getElementById('tokenInput').value = t; }
  }

  loadSettings();

  // Safe DOM helpers
  function clearChildren(el) { while (el.firstChild) el.removeChild(el.firstChild); }

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    if (attrs) Object.entries(attrs).forEach(([k, v]) => {
      if (k === 'textContent') node.textContent = v;
      else if (k === 'className') node.className = v;
      else if (k === 'onclick') node.addEventListener('click', v);
      else if (k.startsWith('style_')) node.style[k.slice(6)] = v;
      else node.setAttribute(k, v);
    });
    if (children) children.forEach(c => { if (c) node.appendChild(c); });
    return node;
  }

  function log(msg, level) {
    const area = document.getElementById('logArea');
    const ts = new Date().toLocaleTimeString();
    const entry = el('div', { className: 'log-entry ' + (level || 'info') }, [
      el('span', { className: 'ts', textContent: ts + ' ' }),
      el('span', { className: 'msg', textContent: msg }),
    ]);
    area.appendChild(entry);
    area.scrollTop = area.scrollHeight;
  }

  async function api(path, params) {
    const url = new URL(path, HOST);
    if (params) Object.entries(params).forEach(([k, v]) => { if (v !== '' && v != null) url.searchParams.set(k, String(v)); });
    const res = await fetch(url.toString(), { headers: { 'Authorization': 'Bearer ' + TOKEN } });
    if (!res.ok) throw new Error('HTTP ' + res.status + ': ' + res.statusText);
    return res.json();
  }

  function setDot(state) { document.getElementById('statusDot').className = 'status-dot ' + state; }

  async function connect() {
    HOST = document.getElementById('hostInput').value.replace(/\/+$/, '');
    TOKEN = document.getElementById('tokenInput').value.trim();
    saveSettings();
    log('Connecting to ' + HOST + '...', 'info');
    try {
      await fetchStatus();
      setDot('connected');
      log('Connected successfully', 'ok');
      await fetchSignatures();
    } catch (e) {
      setDot('error');
      log('Connection failed: ' + e.message, 'err');
    }
  }

  async function fetchStatus() {
    const data = await api('/api/sonic_analysis/status');
    renderStats(data);
    log('Status: ' + data.db_signatures + ' sigs in DB, ' + data.index_size + ' in index', 'ok');
  }

  function renderStats(data) {
    const grid = document.getElementById('statsGrid');
    clearChildren(grid);
    const cards = [
      { label: 'DB Signatures', value: String(data.db_signatures), cls: data.db_signatures > 0 ? '' : 'dim' },
      { label: 'Index Size', value: String(data.index_size), cls: data.index_size > 0 ? '' : 'dim' },
      { label: 'Label Map', value: String(data.label_map_size), cls: 'info' },
      { label: 'Corpus Stats', value: data.has_corpus_stats ? 'YES' : 'NO', cls: data.has_corpus_stats ? '' : 'warn' },
      { label: 'Dimensions', value: String(data.signature_dimensions), cls: 'info' },
      { label: 'Version', value: 'v' + data.signature_version, cls: 'info' },
      { label: 'Analyze on Play', value: data.analyze_on_play ? 'ON' : 'OFF', cls: data.analyze_on_play ? '' : 'dim' },
      { label: 'Analyze on Sync', value: data.analyze_on_sync ? 'ON' : 'OFF', cls: data.analyze_on_sync ? '' : 'dim' },
    ];
    cards.forEach(c => {
      grid.appendChild(el('div', { className: 'stat-card' }, [
        el('div', { className: 'stat-label', textContent: c.label }),
        el('div', { className: 'stat-value ' + c.cls, textContent: c.value }),
      ]));
    });
  }

  async function fetchSignatures() {
    try {
      const data = await api('/api/sonic_analysis/signatures', { limit: SIG_PAGE_SIZE, offset: sigPage * SIG_PAGE_SIZE });
      renderSignatures(data);
    } catch (e) { log('Signatures fetch failed: ' + e.message, 'err'); }
  }

  function renderSignatures(data) {
    const body = document.getElementById('sigBody');
    clearChildren(body);
    const totalPages = Math.ceil(data.total / SIG_PAGE_SIZE) || 1;
    document.getElementById('pageInfo').textContent = (sigPage + 1) + ' / ' + totalPages + ' (' + data.total + ' total)';

    if (data.signatures.length === 0) {
      const td = el('td', { textContent: 'No signatures stored', colspan: '6', style_textAlign: 'center', style_color: 'var(--text-dim)', style_padding: '2rem' });
      body.appendChild(el('tr', {}, [td]));
      return;
    }
    data.signatures.forEach((s, i) => {
      const btn = el('button', {
        className: 'secondary',
        textContent: 'Similar',
        style_padding: '0.2rem 0.6rem',
        style_fontSize: '0.65rem',
        onclick: () => { document.getElementById('simInput').value = s.item_id; searchSimilar(); }
      });
      body.appendChild(el('tr', {}, [
        el('td', { textContent: String(sigPage * SIG_PAGE_SIZE + i + 1) }),
        el('td', { textContent: s.item_id, title: s.item_id }),
        el('td', {}, [el('span', { className: 'badge', textContent: s.provider, style_display: 'inline-block', style_padding: '0.15rem 0.5rem', style_borderRadius: '3px', style_fontSize: '0.65rem', style_fontWeight: '600', style_background: 'var(--surface-2)', style_border: '1px solid var(--border)' })]),
        el('td', { textContent: 'v' + s.version }),
        el('td', { textContent: String(s.feature_count) }),
        el('td', {}, [btn]),
      ]));
    });
  }

  function prevPage() { if (sigPage > 0) { sigPage--; fetchSignatures(); } }
  function nextPage() { sigPage++; fetchSignatures(); }

  async function searchSimilar() {
    const itemId = document.getElementById('simInput').value.trim();
    const limit = document.getElementById('simLimit').value;
    if (!itemId) return;

    const list = document.getElementById('resultsList');
    clearChildren(list);
    list.appendChild(el('div', { className: 'empty-state' }, [
      el('span', { className: 'spinner' }),
      document.createTextNode('\u00a0 Searching...'),
    ]));
    log('Searching similar to ' + itemId + ' (limit ' + limit + ')...', 'info');

    try {
      const data = await api('/api/sonic_analysis/similar', { item_id: itemId, limit: limit });
      clearChildren(list);
      if (!data.analyzed) {
        list.appendChild(el('div', { className: 'empty-state', textContent: 'Track not yet analyzed' }));
        log('Track ' + itemId + ' has no sonic signature', 'err');
        return;
      }
      if (data.items.length === 0) {
        list.appendChild(el('div', { className: 'empty-state', textContent: 'No similar tracks found' }));
        log('No similar tracks in index', 'info');
        return;
      }
      data.items.forEach((item, i) => {
        const d = item.distance;
        const cls = d < 0.3 ? 'dist-close' : d < 0.7 ? 'dist-mid' : 'dist-far';
        list.appendChild(el('div', { className: 'result-item' }, [
          el('div', { className: 'result-rank', textContent: '#' + (i + 1) }),
          el('div', { className: 'result-info' }, [
            el('div', { className: 'result-id', textContent: item.item_id }),
            el('div', { className: 'result-provider', textContent: item.provider }),
          ]),
          el('div', { className: 'result-distance ' + cls, textContent: d.toFixed(4) }),
        ]));
      });
      log('Found ' + data.items.length + ' similar tracks', 'ok');
    } catch (e) {
      clearChildren(list);
      list.appendChild(el('div', { className: 'empty-state', style_color: 'var(--warn)', textContent: e.message }));
      log('Search failed: ' + e.message, 'err');
    }
  }

  async function rawApiCall() {
    const endpoint = document.getElementById('apiEndpoint').value;
    const paramsStr = document.getElementById('apiParams').value;
    const out = document.getElementById('rawOutput');
    out.textContent = 'Loading...';

    const params = {};
    if (paramsStr) {
      paramsStr.split('&').forEach(p => {
        const parts = p.split('=');
        if (parts[0]) params[parts[0].trim()] = (parts[1] || '').trim();
      });
    }

    try {
      const data = await api(endpoint, params);
      out.textContent = JSON.stringify(data, null, 2);
    } catch (e) { out.textContent = 'ERROR: ' + e.message; }
  }

  async function refreshAll() {
    try { await fetchStatus(); await fetchSignatures(); setDot('connected'); }
    catch (e) { setDot('error'); }
  }

  if (HOST && TOKEN) setTimeout(connect, 300);
</script>
</body>
</html>
