# Music Assistant dev container for Unraid, running this checkout next to the production server.
#
# It has its own data directory and ports, so it never touches the production install.
# Bridge networking keeps it off the production ports (8095/8097) at the cost of player
# discovery, which is fine for trying out providers such as AI Artwork.
name: music-assistant-dev

services:
  music-assistant-dev:
    build:
      context: ../..
      dockerfile: scripts/unraid/Dockerfile
      args:
        MA_IMAGE: ${MA_IMAGE:-ghcr.io/music-assistant/server:nightly}
    image: music-assistant-server:dev
    container_name: music-assistant-dev
    restart: unless-stopped
    command: ["--log-level", "debug"]
    ports:
      - "${MA_DEV_PORT:-8195}:8095"
      - "${MA_DEV_STREAM_PORT:-8197}:8097"
    volumes:
      - ${MA_DEV_DATA:-/mnt/user/appdata/music-assistant-dev}:/data
    environment:
      - TZ=${TZ:-America/New_York}
