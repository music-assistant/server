# Local development compose file — builds from this checkout instead of pulling
# the official ghcr.io/music-assistant/server image.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up --build
#
services:
  music-assistant-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: music-assistant-dev
    container_name: music-assistant-dev
    restart: unless-stopped
    network_mode: host
    volumes:
      - mass-data:/data
    # network_mode: host (matching the official install docs) so Music
    # Assistant can see mDNS/SSDP/UDP-broadcast discovery from players and
    # plugins (Chromecast, DLNA, AriaCast, etc.) on the LAN. Requires a native
    # Linux Docker host — on Docker Desktop for Windows/Mac this network mode
    # doesn't give the container real LAN broadcast visibility, so swap this
    # for a `ports: ["8095:8095"]` mapping there instead (loses discovery).

volumes:
  mass-data:
