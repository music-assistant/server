# Synchronization: Yandex Music → Kion Music
# This configuration defines how to sync Yandex Music provider to Kion Music provider
upstream_provider: yandex_music
downstream_provider: kion_music

# Files to sync (all provider files)
sync_files:
  - provider.py
  - api_client.py
  - parsers.py
  - streaming.py
  - constants.py
  - __init__.py
  - manifest.json

# Test files to sync (from tests/providers/yandex_music/ to tests/providers/kion_music/)
sync_test_files:
  - conftest.py
  - test_api_client.py
  - test_parsers.py
  - test_streaming.py
  - test_my_wave.py

# Global string transformations (applied in order)
# Note: Preserves 'yandex_music' library imports since both providers use the same library
# IMPORTANT: More specific patterns must come BEFORE general ones
transformations:
  # Class names (must come before general string replacements)
  - pattern: 'YandexMusicProvider'
    replacement: 'KionMusicProvider'
  - pattern: 'YandexMusicClient'
    replacement: 'KionMusicClient'
  - pattern: 'YandexMusicStreamingManager'
    replacement: 'KionMusicStreamingManager'

  # Branding in strings and docstrings (specific before general)
  - pattern: 'Yandex Music service'
    replacement: 'KION Music (MTS) service'
  - pattern: 'Yandex Music provider'
    replacement: 'KION Music provider'
  - pattern: 'Yandex Music'
    replacement: 'KION Music'
  - pattern: 'Yandex API'
    replacement: 'KION API'

  # Feature branding: My Wave → My Mix
  - pattern: 'My Wave'
    replacement: 'My Mix'
  - pattern: 'Моя волна'
    replacement: 'Мой Микс'
  - pattern: 'my_wave'
    replacement: 'my_mix'
  - pattern: 'MY_WAVE'
    replacement: 'MY_MIX'

# File-specific transformations (critical for API endpoint)
file_transformations:
  api_client.py:
    # Preserve KION API endpoint
    - pattern: 'GET_FILE_INFO_BASE_URL = "https://api.music.yandex.net"'
      replacement: 'KION_BASE_URL = "https://music.mts.ru/ya_api"'
    - pattern: 'base_url=GET_FILE_INFO_BASE_URL'
      replacement: 'base_url=KION_BASE_URL'
    - pattern: 'GET_FILE_INFO_BASE_URL'
      replacement: 'KION_BASE_URL'
    # Set base_url on client after creation (more reliable than constructor parameter)
    - pattern: 'self._client = await ClientAsync(self._token).init()'
      replacement: |
        # Create client and set KION base URL
                    client = ClientAsync(self._token)
                    # Override base_url for KION Music API
                    client.base_url = KION_BASE_URL
                    self._client = await client.init()
    # Transform web URLs in error messages
    - pattern: 'music.yandex.ru'
      replacement: 'music.mts.ru'

  parsers.py:
    # Transform web URLs for artists, albums, tracks, playlists
    - pattern: 'https://music.yandex.ru/'
      replacement: 'https://music.mts.ru/'

  constants.py:
    # Rename My Wave constants to My Mix
    - pattern: 'CONF_MY_WAVE_MAX_TRACKS'
      replacement: 'CONF_MY_MIX_MAX_TRACKS'
    - pattern: 'CONF_MY_WAVE_BATCH_SIZE'
      replacement: 'CONF_MY_MIX_BATCH_SIZE'
    - pattern: 'ROTOR_STATION_MY_WAVE'
      replacement: 'ROTOR_STATION_MY_MIX'
    - pattern: 'MY_WAVE_PLAYLIST_ID'
      replacement: 'MY_MIX_PLAYLIST_ID'

  __init__.py:
    # Mark experimental features with default=False
    # Handle both with and without trailing comma
    - pattern: 'default_value=True,'
      replacement: 'default_value=False,  # Experimental feature - disabled by default'
    - pattern: 'default_value=True'
      replacement: 'default_value=False  # Experimental feature - disabled by default'

  manifest.json:
    - pattern: '"domain": "yandex_music"'
      replacement: '"domain": "kion_music"'
    - pattern: '"name": "Yandex Music"'
      replacement: '"name": "KION Music"'
    - pattern: 'Stream music from Yandex Music service'
      replacement: 'Stream music from KION Music (MTS) service'
    - pattern: 'yandex-music/'
      replacement: 'kion-music/'

  # Test file transformations
  conftest.py:
    - pattern: 'yandex_music'
      replacement: 'kion_music'

  test_api_client.py:
    - pattern: 'from music_assistant.providers.yandex_music'
      replacement: 'from music_assistant.providers.kion_music'
    - pattern: 'GET_FILE_INFO_BASE_URL'
      replacement: 'KION_BASE_URL'

  test_parsers.py:
    - pattern: 'from music_assistant.providers.yandex_music'
      replacement: 'from music_assistant.providers.kion_music'
    - pattern: 'music.yandex.ru'
      replacement: 'music.mts.ru'
    - pattern: 'avatars.yandex.net'
      replacement: 'avatars.yandex.net'

  test_streaming.py:
    - pattern: 'from music_assistant.providers.yandex_music'
      replacement: 'from music_assistant.providers.kion_music'

  test_my_wave.py:
    # This file will be renamed to test_my_mix.py
    - pattern: 'from music_assistant.providers.yandex_music'
      replacement: 'from music_assistant.providers.kion_music'
    - pattern: 'test_my_wave'
      replacement: 'test_my_mix'
    - pattern: 'test_parse_radio_item_id'
      replacement: 'test_parse_radio_item_id'

# Features to exclude if KION API doesn't support them (empty = sync all)
exclude_features: []

# Constants to preserve (won't be overwritten by sync)
preserve_constants:
  - KION_BASE_URL
