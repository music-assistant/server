version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: daily
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # Batch bumps of the libraries we maintain ourselves into a single, easy-to-merge
      # PR so they stay visible (these live in provider manifest.json files; the
      # Sync manifests workflow back-propagates the bump into the owning manifest).
      music-assistant-libs:
        patterns:
          - "PyChromecast"
          - "aiosonos"
          - "aioslimproto"
          - "aiosendspin*"
          - "hass-client"
