---
name: PR Labels

# Each PR must carry exactly one of the labels the release-notes
# generator knows how to slot into a section. We derive that label
# from the "Types of changes" checkbox in the PR template and apply
# it automatically — most external contributors can't label their
# own PRs. The Verify job fails when more than one box is ticked, or
# when none is and the PR doesn't already carry a single known label.
# A PR labelled `new-provider` also gets one comment telling the
# author what a provider in the server asks of them.
#
# Verify runs on the pull request itself, without write access. The
# Apply job runs from `dev` after the "PR event" workflow and reads the
# pull request through the API, so pull requests from forks get their
# label and comment as well.

# yamllint disable-line rule:truthy
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - labeled
      - unlabeled
      - reopened
      - ready_for_review
    branches:
      - dev
  workflow_run:
    workflows: [PR event]
    types: [completed]

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # GitHub-typed bots (Dependabot, musicassistant-bot[bot], etc.)
    # don't follow the PR template and apply their own labels, so
    # skip them outright. Trusted automation can also pre-apply a
    # known-set label, which chooseLabel honours when no box is ticked.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.user.type != 'Bot'
    permissions:
      contents: read
    steps:
      - name: ⤵️ Check out the label rules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: 🏷 Check the "Types of changes" checkbox
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { chooseLabel } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-labels.cjs`);
            const result = chooseLabel(context.payload.pull_request);
            if (result.error) {
              core.setFailed(result.error);
            }

  apply:
    name: Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run'
    permissions:
      contents: read
      pull-requests: write
    # One run at a time per PR: two runs side by side would both find
    # no comment yet and post it twice.
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{
        github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: ⤵️ Check out the label rules
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: 🏷 Apply label from PR description checkbox
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const dir = `${process.env.GITHUB_WORKSPACE}/.github/scripts`;
            const { findPullRequest } = require(`${dir}/pr-event.cjs`);
            const { KNOWN, chooseLabel } = require(`${dir}/pr-labels.cjs`);

            // A PR merged right after opening still gets its label.
            const pr = await findPullRequest({ github, context, core, base: 'dev' })
              ?? await findPullRequest({ github, context, core, base: 'dev', state: 'closed' });
            if (!pr || pr.user.type === 'Bot') {
              return;
            }

            const { owner, repo } = context.repo;
            const issue_number = pr.number;
            const current = pr.labels.map(l => l.name);
            const { label, existing } = chooseLabel(pr);

            if (existing === 'new-provider') {
              await commentOnNewProvider();
            }
            if (!label) {
              return;
            }

            // Strip any stale labels from the known set so a
            // contributor changing their mind in the description
            // doesn't leave the previous label behind.
            for (const name of current) {
              if (KNOWN.includes(name) && name !== label) {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number, name,
                }).catch(() => {});
              }
            }
            if (!current.includes(label)) {
              await github.rest.issues.addLabels({
                owner, repo, issue_number, labels: [label],
              });
            }
            if (label === 'new-provider') {
              await commentOnNewProvider();
            }

            // Posted once per PR: the hidden marker finds an earlier
            // comment, so later edits, pushes and relabels never post
            // it again, and a label change leaves it in place.
            async function commentOnNewProvider() {
              const marker = '<!-- new-provider -->';
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number },
              );
              if (comments.some(c => c.body?.includes(marker))) {
                return;
              }
              const guide = 'https://github.com/music-assistant/server/' +
                'blob/dev/DEVELOPMENT.md#-contributing-a-provider';
              const rules = 'https://github.com/music-assistant/' +
                '.github/blob/main/COMMUNITY_CATALOG_RULES.md';
              const template = 'https://github.com/music-assistant/' +
                'community-provider-template';
              const submit = 'https://github.com/music-assistant/' +
                'community-catalog/issues/new?template=submit-provider.yml';
              const building = 'https://developers.music-assistant.io/' +
                'building-a-provider/';
              const body = [
                marker,
                'Thanks for this provider! One thing worth knowing ' +
                'before we go further: Music Assistant has a ' +
                '**community catalog**. You publish a provider from ' +
                'your own repository, and users install and update it ' +
                'from the Marketplace in the app.',
                '',
                'You can choose either route for this one:',
                '',
                '- **In the server (this PR):** the team reviews the ' +
                'code in depth and supports the provider for years ' +
                'after it ships, so it asks more than working code:',
                '  - **People ask for it:** link the feature request or ' +
                'discussion.',
                '  - **It is documented:** a pull request on the ' +
                'documentation comes with it.',
                '  - **It meets the standards:** it passes `lint` and ' +
                '`test`, has tests of its own, and a player provider is ' +
                'tested on real hardware.',
                '  - **You maintain it:** you are listed in `codeowners` ' +
                'and keep following up. A provider whose maintainer no ' +
                'longer follows up may be moved out of the server.',
                '',
                '  Review rounds can take a while, and every later change ' +
                'goes through a PR here and waits for a server release.',
                '- **In the community catalog:** the provider lives in ' +
                'your own repository and you release it whenever you ' +
                'want. We decide once whether it gets in (does it do ' +
                'what it says, does it stay within the ' +
                `[rules](${rules})), and every release is then checked ` +
                'automatically, but we don\'t review its code quality. ' +
                'You support it yourself, and users install it at their ' +
                'own risk.',
                '',
                'For the community route, start from the ' +
                `[provider template](${template}), publish a release ` +
                'and submit it with the ' +
                `[Submit a provider](${submit}) form, then close this ` +
                `PR. [What a provider in the server asks](${guide}) ` +
                `and [Building a provider](${building}) have the ` +
                'details. If you\'d rather keep it in the server, just ' +
                'say so and we carry on here.',
              ].join('\n');
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
