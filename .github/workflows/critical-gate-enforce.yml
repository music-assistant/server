name: Critical review gate (enforce)

# Stage 2 of 2. Runs after "Critical review gate (detect)" via `workflow_run`, which grants a WRITE
# token even when the upstream review was on a fork PR (`pull_request_review` itself does not — that
# is the whole reason for the split). If detect flagged a [CRITICAL] — signalled by a
# `critical-gate-request` artifact holding the PR number and reviewed head SHA — this converts that
# PR to a draft (a draft PR cannot be merged) and leaves one comment saying why. Checks out no PR
# code; its only inputs are a trusted integer PR number and SHA written by detect from the payload.

on:  # yamllint disable-line rule:truthy
  workflow_run:
    workflows: ["Critical review gate (detect)"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Check whether detect raised an enforcement request
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # Preflight existence: an ABSENT artifact is the expected no-op (a non-critical review, or a
          # detect run skipped for a non-Copilot reviewer). A PRESENT artifact means a later download
          # failure is a real error that must surface — not be swallowed like a missing one.
          exists=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "critical-gate-request")] | length')
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          if [ "$exists" -gt 0 ]; then echo "Enforcement request present."; else echo "No request; nothing to do."; fi

      - name: Download the enforcement request
        if: steps.check.outputs.exists != '0'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: critical-gate-request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Draft the PR and post the explanation
        if: steps.check.outputs.exists != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Leads with a hidden marker so the explanation is posted at most once, even across reruns.
          GATE_BODY: |
            <!-- critical-gate -->
            🚧 **Automated critical-issue gate** — the automated review flagged at least one **`[CRITICAL]`** finding, so this PR was converted to a **draft** to keep it out of the merge queue while it's still being worked on. Please resolve the `[CRITICAL]` item(s) above, then click **Ready for review**.

            _Maintainers: add the `override-critical` label to bypass this._
        run: |
          set -euo pipefail
          PR="$(cat pr-number.txt)"
          REVIEWED_HEAD="$(cat head-sha.txt)"
          case "$PR" in ''|*[!0-9]*) echo "invalid PR number in artifact"; exit 1 ;; esac

          # Detect ran earlier; re-validate against the PR's CURRENT state before acting.
          info=$(gh pr view "$PR" --repo "$REPO" --json headRefOid,isDraft,state,labels)
          cur_head=$(jq -r '.headRefOid' <<<"$info")
          is_draft=$(jq -r '.isDraft' <<<"$info")
          state=$(jq -r '.state' <<<"$info")
          overridden=$(jq -r '[.labels[].name] | index("override-critical") != null' <<<"$info")

          if [ "$state" != "OPEN" ]; then echo "PR #$PR is $state; skipping."; exit 0; fi
          if [ "$overridden" = "true" ]; then echo "override-critical label present; skipping."; exit 0; fi
          if [ "$cur_head" != "$REVIEWED_HEAD" ]; then
            echo "Head moved since review ($REVIEWED_HEAD -> $cur_head); the newer commit gets its own review. Skipping."
            exit 0
          fi

          # Post the explanation idempotently and independently of the draft step, so it can't be lost
          # if an earlier run drafted the PR but failed before commenting.
          existing=$(gh pr view "$PR" --repo "$REPO" --json comments --jq '.comments[].body')
          if printf '%s' "$existing" | grep -qF "<!-- critical-gate -->"; then
            echo "Explanation already posted."
          else
            gh pr comment "$PR" --repo "$REPO" --body "$GATE_BODY"
          fi

          # Draft only if it isn't already one.
          if [ "$is_draft" = "true" ]; then
            echo "PR #$PR is already a draft."
          else
            gh pr ready "$PR" --repo "$REPO" --undo
          fi
