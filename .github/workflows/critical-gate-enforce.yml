name: Critical review gate (enforce)

# Stage 2 of 2. Runs after "Critical review gate (detect)" via `workflow_run`, which grants a WRITE
# token even when the upstream review was on a fork PR (`pull_request_review` itself does not — the
# reason for the split).
#
# SECURITY: on a fork PR, detect runs the PR's OWN copy of its workflow, so nothing it produces can
# be trusted. The `critical-gate-request` artifact is therefore used ONLY as an existence hint
# ("worth checking") — its contents are ignored. Every fact acted on is re-derived from
# `workflow_run.head_sha`, which GitHub stamps on the event and a fork cannot forge, and the
# [CRITICAL] finding is re-verified here. This mirrors the repo's dependency-security-report.yml.

on:  # yamllint disable-line rule:truthy
  workflow_run:
    workflows: ["Critical review gate (detect)"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  enforce:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'pull_request_review'
    runs-on: ubuntu-latest
    steps:
      - name: Draft PRs whose current Copilot review still has an unresolved [CRITICAL]
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.payload.workflow_run.id;

            // Untrusted hint only: detect may run fork-controlled code, so its artifact's mere
            // existence gates work here; its contents are never read. All facts are re-derived below.
            const arts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: runId, per_page: 100 });
            if (!arts.some(a => a.name === 'critical-gate-request')) {
              core.info('No enforcement hint from detect; nothing to do.');
              return;
            }

            // head_sha is stamped by GitHub on the workflow_run event and cannot be forged by a fork.
            const headSha = context.payload.workflow_run.head_sha;
            const assoc = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { owner, repo, commit_sha: headSha, per_page: 100 });
            const prs = assoc.filter(p =>
              p.state === 'open' &&
              p.head.sha === headSha &&
              !p.labels.some(l => l.name === 'override-critical'));
            if (prs.length === 0) { core.info(`No actionable open PR at head ${headSha}.`); return; }

            const MARKER = '<!-- critical-gate -->';
            const BODY = [
              MARKER,
              '🚧 **Automated critical-issue gate** — the automated review flagged at least one ' +
              '**`[CRITICAL]`** finding, so this PR was converted to a **draft** to keep it out of ' +
              "the merge queue while it's still being worked on. Please resolve the `[CRITICAL]` " +
              'item(s) above, then click **Ready for review**.',
              '',
              '_Maintainers: add the `override-critical` label to bypass this._',
            ].join('\n');
            const REVIEWER = 'copilot-pull-request-reviewer[bot]';

            let failed = false;
            for (const pr of prs) {
              try {
                // Re-verify the finding on THIS PR's latest Copilot review — never trust the detector.
                const reviews = await github.paginate(github.rest.pulls.listReviews,
                  { owner, repo, pull_number: pr.number, per_page: 100 });
                const copilot = reviews.filter(r => r.user && r.user.login === REVIEWER);
                if (copilot.length === 0) continue;
                const latest = copilot[copilot.length - 1];
                let critical = (latest.body || '').includes('[CRITICAL]');
                if (!critical) {
                  const cmts = await github.paginate(github.rest.pulls.listCommentsForReview,
                    { owner, repo, pull_number: pr.number, review_id: latest.id, per_page: 100 });
                  critical = cmts.some(c => (c.body || '').includes('[CRITICAL]'));
                }
                if (!critical) { core.info(`PR #${pr.number}: latest Copilot review has no [CRITICAL].`); continue; }

                // Draft FIRST — it is the gate. Never swallow a failure here: it must fail the run
                // (fail closed) rather than leave the PR mergeable while reporting success.
                if (pr.draft) {
                  core.info(`PR #${pr.number} already a draft.`);
                } else {
                  await github.graphql(
                    'mutation($id: ID!) { convertPullRequestToDraft(input: { pullRequestId: $id }) { pullRequest { isDraft } } }',
                    { id: pr.node_id });
                  core.info(`PR #${pr.number}: drafted on unresolved [CRITICAL].`);
                }

                // Then the explanation, idempotent (hidden marker) and independent of draft state,
                // so a run that drafted but failed to comment recovers it on the next run.
                const comments = await github.paginate(github.rest.issues.listComments,
                  { owner, repo, issue_number: pr.number, per_page: 100 });
                if (!comments.some(c => (c.body || '').includes(MARKER))) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: BODY });
                }
              } catch (e) {
                failed = true;
                core.error(`PR #${pr.number}: enforcement failed: ${e.message}`);
              }
            }
            if (failed) core.setFailed('One or more PRs could not be gated; see errors above.');
