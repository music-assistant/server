name: Critical review gate (enforce)

# Stage 2 of 2. Runs after "Critical review gate (detect)" via `workflow_run`, which grants a WRITE
# token even when the upstream review was on a fork PR (`pull_request_review` itself does not — that
# is the whole reason for the split). If detect flagged a [CRITICAL] — signalled by a
# `critical-gate-request` artifact holding the PR number — this converts that PR to a draft (a draft
# PR cannot be merged) and leaves one comment saying why. Checks out no PR code; its only input is a
# trusted integer PR number written by detect from the event payload.

on:  # yamllint disable-line rule:truthy
  workflow_run:
    workflows: ["Critical review gate (detect)"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Fetch the enforcement request, if detect raised one
        id: req
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: critical-gate-request
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Draft the PR and explain
        if: steps.req.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Literal YAML block (no bash heredoc): backticks/markdown stay clean and are never
          # re-scanned for command substitution when passed as "$GATE_BODY".
          GATE_BODY: |
            🚧 **Automated critical-issue gate** — the automated review flagged at least one **`[CRITICAL]`** finding, so this PR was converted to a **draft** to keep it out of the merge queue while it's still being worked on. Please resolve the `[CRITICAL]` item(s) above, then click **Ready for review**.

            _Maintainers: add the `override-critical` label to bypass this._
        run: |
          set -euo pipefail
          PR="$(cat pr-number.txt)"
          case "$PR" in ''|*[!0-9]*) echo "invalid PR number in artifact"; exit 1 ;; esac
          # Only draft if it isn't already one (a later critical review re-runs this stage).
          if [ "$(gh pr view "$PR" --repo "$REPO" --json isDraft --jq '.isDraft')" != "false" ]; then
            echo "PR #$PR is already a draft; nothing to do."
            exit 0
          fi
          gh pr ready "$PR" --repo "$REPO" --undo
          gh pr comment "$PR" --repo "$REPO" --body "$GATE_BODY"
