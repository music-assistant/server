name: Build Smart DJ image

on:
  workflow_dispatch:
  push:
    branches: ["dev"]
    paths:
      - "music_assistant/providers/smart_dj/**"
      - "docker/smartdj.Dockerfile"

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/mattamays-ai/server
concurrency:
  group: smartdj-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/smartdj.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:0.0.4
            ${{ env.IMAGE }}:sha-${{ github.sha }}
