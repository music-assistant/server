name: Critical review gate (detect)

# Stage 1 of 2. Reacts to Copilot's automated review; if it carries a [CRITICAL] finding, uploads a
# hint artifact so the enforce stage knows to look. Runs with a READ-only token on purpose: on a
# fork PR the `pull_request_review` event is unprivileged. It is also UNTRUSTED — a fork PR runs its
# own copy of this file — so it deliberately carries NO authority: the artifact is a bare "worth
# checking" hint, and enforce re-derives and re-verifies every fact from GitHub-stamped data. Checks
# out no PR code; only substring-matches "[CRITICAL]".

on:  # yamllint disable-line rule:truthy
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    # Only Copilot's reviewer, only while the PR is still open for merge (not a draft), honouring the
    # override label. These only reduce noise — enforce re-checks all of them from trusted data.
    if: >-
      github.event.review.user.login == 'copilot-pull-request-reviewer[bot]'
      && github.event.pull_request.draft == false
      && !contains(github.event.pull_request.labels.*.name, 'override-critical')
    steps:
      - name: Scan the review for a [CRITICAL] finding
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_BODY: ${{ github.event.review.body }}
        run: |
          set -euo pipefail
          # Paginate: a [CRITICAL] can sit past the first 30 inline comments of a large review.
          comment_hits=$(gh api --paginate --slurp \
            "repos/$REPO/pulls/$PR/reviews/$REVIEW_ID/comments" \
            --jq '[.[][] | select((.body // "") | contains("[CRITICAL]"))] | length')
          body_hits=0
          case "$REVIEW_BODY" in *"[CRITICAL]"*) body_hits=1 ;; esac
          if [ "$comment_hits" -eq 0 ] && [ "$body_hits" -eq 0 ]; then
            echo "No [CRITICAL] finding; nothing to enforce."
            echo "critical=false" >> "$GITHUB_OUTPUT"
          else
            echo "Critical finding(s) present (summary=$body_hits, inline=$comment_hits) on PR #$PR."
            echo "critical=true" >> "$GITHUB_OUTPUT"
            # Existence hint only; enforce ignores the contents and re-verifies from head_sha.
            echo "PR #$PR flagged by Copilot; enforce will re-verify." > detected.txt
          fi

      - name: Upload the enforcement hint
        if: steps.scan.outputs.critical == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: critical-gate-request
          path: detected.txt
          retention-days: 1
