# Manually-dispatched performance comparison: runs the quick benchmark suite on a
# baseline ref and a candidate ref back-to-back on the same runner and posts the
# comparison as the job summary. Shared-runner variance makes this a smoke check
# for large regressions only - for trustworthy numbers run the full suite locally
# (see scripts/perf/README.md).

name: Perf benchmark

on:
  workflow_dispatch:
    inputs:
      baseline-ref:
        description: "Baseline git ref"
        required: true
        default: "dev"
      candidate-ref:
        description: "Candidate git ref to compare against the baseline"
        required: true

permissions:
  contents: read

env:
  URLLIB3_NO_OVERRIDE: "1"

jobs:
  benchmark:
    name: ${{ inputs.candidate-ref }} vs ${{ inputs.baseline-ref }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out baseline ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.baseline-ref }}
      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version-file: ".python-version"
          check-latest: true
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install uv
        run: pip install uv
      - name: Install baseline dependencies
        run: uv pip install --system --index-strategy unsafe-best-match -e ".[test]"
      - name: Run benchmark on baseline ref
        run: python scripts/perf/run_benchmark.py --quick --out /tmp/baseline.json
      - name: Check out candidate ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate-ref }}
      - name: Install candidate dependencies
        run: uv pip install --system --index-strategy unsafe-best-match -e ".[test]"
      - name: Run benchmark on candidate ref and compare
        run: |
          set -o pipefail
          python scripts/perf/run_benchmark.py --quick --out /tmp/candidate.json \
            --compare /tmp/baseline.json | tee /tmp/compare.txt
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Perf benchmark: ${{ inputs.candidate-ref }} vs ${{ inputs.baseline-ref }}"
            echo
            echo "Quick mode on a shared runner - treat small deltas as noise."
            echo
            echo '```'
            cat /tmp/compare.txt 2>/dev/null || echo "comparison did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-reports
          path: /tmp/*.json
