name: Critical review gate

# When Copilot's automated review flags a [CRITICAL] finding, block the PR from merge: convert it
# to a draft (a draft PR cannot be merged) and submit a request-changes review that explains why.
# This keeps still-being-worked-on PRs out of the "ready to merge" state.
#
# This is deterministic glue, NOT a reviewer: it reacts to Copilot's own review output, it does not
# judge the code. It triggers on `pull_request_review` — a trusted event that runs in the base repo
# with a writable token even for fork PRs (unlike `pull_request`) — so it gates outside
# contributions too. It checks out no PR code and only substring-matches "[CRITICAL]", so there is
# no prompt-injection surface.

on:  # yamllint disable-line rule:truthy
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write

# Serialize per PR (without cancelling a run that may be mid-gate) so a rare double review can't
# double-post.
concurrency:
  group: critical-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    # React only to Copilot's reviewer, only while the PR is still open for merge (not a draft), and
    # honour an explicit maintainer override label.
    if: >-
      github.event.review.user.login == 'copilot-pull-request-reviewer[bot]'
      && github.event.pull_request.draft == false
      && !contains(github.event.pull_request.labels.*.name, 'override-critical')
    steps:
      - name: Draft + request changes on a [CRITICAL] finding
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEW_BODY: ${{ github.event.review.body }}
          # Backticks/markdown are literal here (a YAML block scalar), and passing it as "$GATE_BODY"
          # never re-scans the value for command substitution — so no heredoc/escaping games.
          GATE_BODY: |
            🚧 **Automated critical-issue gate**

            This PR's automated review raised at least one **`[CRITICAL]`** finding, so I've converted it to a **draft** and requested changes. A draft PR can't be merged until it's marked ready again.

            Please resolve the `[CRITICAL]` item(s) above, then click **Ready for review**. This only keeps in-progress work out of the merge queue — it isn't a judgment on the change.

            _Maintainers: add the `override-critical` label to bypass this on a false positive._
        run: |
          set -euo pipefail

          # Re-check draft state at run time: if it's already a draft (we gated it on an earlier
          # review, or the author drafted it), it's already merge-blocked — nothing to do.
          if [ "$(gh pr view "$PR" --repo "$REPO" --json isDraft --jq '.isDraft')" != "false" ]; then
            echo "PR #$PR is already a draft; nothing to gate."
            exit 0
          fi

          # "[CRITICAL]" can appear in the review summary body or in any of its inline comments.
          comment_hits=$(gh api "repos/$REPO/pulls/$PR/reviews/$REVIEW_ID/comments" \
                           --jq '[.[] | select((.body // "") | contains("[CRITICAL]"))] | length')
          body_hits=0
          case "$REVIEW_BODY" in *"[CRITICAL]"*) body_hits=1 ;; esac
          if [ "$comment_hits" -eq 0 ] && [ "$body_hits" -eq 0 ]; then
            echo "No [CRITICAL] finding in this review; nothing to gate."
            exit 0
          fi

          echo "Critical finding(s) present (summary=$body_hits, inline=$comment_hits) — gating PR #$PR."

          # 1) Convert to draft — the hard merge block.
          gh pr ready "$PR" --repo "$REPO" --undo

          # 2) Request changes with an explanation (the visible signal + the "why").
          gh pr review "$PR" --repo "$REPO" --request-changes --body "$GATE_BODY"
