name: Auto Release

# Nightly releases run at 05:00 Europe/Amsterdam when at least two commits landed.
# Beta, RC, and stable releases are started manually from their channel branch.

on:
  schedule:
    - cron: "0 5 * * *"
      timezone: "Europe/Amsterdam"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        options:
          - nightly
          - beta
          - rc
          - stable
        default: nightly
      important_notes:
        description: "Important notes (breaking changes, critical info, etc.)"
        required: false

permissions:
  contents: read

concurrency:
  group: auto-release-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  resolve-release:
    name: Resolve release version and source
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.channel.outputs.branch }}
      channel: ${{ steps.channel.outputs.channel }}
      should_release: ${{ steps.version.outputs.should_release }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve release channel and branch
        id: channel
        env:
          INPUT_CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CHANNEL="$INPUT_CHANNEL"
          else
            CHANNEL="nightly"
          fi

          case "$CHANNEL" in
            stable | rc)
              BRANCH="stable"
              ;;
            beta | nightly)
              BRANCH="dev"
              ;;
            *)
              echo "::error::Unsupported release channel: $CHANNEL"
              exit 1
              ;;
          esac

          {
            echo "branch=$BRANCH"
            echo "channel=$CHANNEL"
          } >> "$GITHUB_OUTPUT"
          echo "Using $BRANCH for the $CHANNEL release"

      - name: Check out release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.channel.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Capture source commit
        id: source
        env:
          BRANCH: ${{ steps.channel.outputs.branch }}
        run: |
          set -euo pipefail

          SOURCE_SHA=$(git rev-parse HEAD)
          REMOTE_SHA=$(git rev-parse "origin/$BRANCH")
          if [[ "$SOURCE_SHA" != "$REMOTE_SHA" ]]; then
            echo "::error::Checked-out $BRANCH moved while resolving the release source"
            exit 1
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Release source: $SOURCE_SHA"

      - name: Calculate next version
        id: version
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail

          latest_tag() {
            local pattern=$1
            git tag --list \
              | grep -E "$pattern" \
              | sort -V \
              | tail -n 1 \
              || true
          }

          require_ancestor() {
            local tag=$1
            local tag_sha
            tag_sha=$(git rev-list -n 1 "$tag^{commit}")
            if ! git merge-base --is-ancestor "$tag_sha" "$SOURCE_SHA"; then
              echo "::error::Latest $CHANNEL tag $tag ($tag_sha) is not an ancestor of $SOURCE_SHA"
              exit 1
            fi
          }

          case "$CHANNEL" in
            stable)
              CHANNEL_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$'
              ;;
            beta)
              CHANNEL_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$'
              ;;
            rc)
              CHANNEL_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+rc[0-9]+$'
              ;;
            nightly)
              CHANNEL_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+\.dev[0-9]+$'
              ;;
          esac

          LAST_TAG=$(latest_tag "$CHANNEL_PATTERN")
          if [[ -n "$LAST_TAG" ]]; then
            require_ancestor "$LAST_TAG"
            COMMITS_SINCE=$(git rev-list --count "$LAST_TAG..$SOURCE_SHA")
          else
            COMMITS_SINCE=$(git rev-list --count "$SOURCE_SHA")
          fi
          echo "Commits since ${LAST_TAG:-the start of history}: $COMMITS_SINCE"

          SHOULD_RELEASE=true
          if [[ "$CHANNEL" == "nightly" && "$COMMITS_SINCE" -lt 2 ]]; then
            SHOULD_RELEASE=false
          fi

          if [[ "$SHOULD_RELEASE" == "false" ]]; then
            {
              echo "should_release=false"
              echo "version="
            } >> "$GITHUB_OUTPUT"
            echo "Skipping nightly release: at least two new commits are required"
            exit 0
          fi

          LAST_STABLE_TAG=$(latest_tag '^[0-9]+\.[0-9]+\.[0-9]+$')
          case "$CHANNEL" in
            nightly)
              if [[ -n "$LAST_STABLE_TAG" ]]; then
                IFS=. read -r MAJOR MINOR _ <<< "$LAST_STABLE_TAG"
                NEW_VERSION="$MAJOR.$((MINOR + 1)).0.dev$(date -u +%Y%m%d%H)"
              else
                NEW_VERSION="0.1.0.dev$(date -u +%Y%m%d%H)"
              fi
              ;;
            beta)
              if [[ "$LAST_TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)b([0-9]+)$ ]]; then
                BETA_MAJOR="${BASH_REMATCH[1]}"
                BETA_MINOR="${BASH_REMATCH[2]}"
                BETA_PATCH="${BASH_REMATCH[3]}"
                BETA_NUMBER="${BASH_REMATCH[4]}"
                START_NEW_CYCLE=false

                if [[ "$LAST_STABLE_TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                  STABLE_MAJOR="${BASH_REMATCH[1]}"
                  STABLE_MINOR="${BASH_REMATCH[2]}"
                  if (( STABLE_MAJOR > BETA_MAJOR )) \
                    || (( STABLE_MAJOR == BETA_MAJOR && STABLE_MINOR >= BETA_MINOR )); then
                    START_NEW_CYCLE=true
                  fi
                fi

                if [[ "$START_NEW_CYCLE" == "true" ]]; then
                  NEW_VERSION="$STABLE_MAJOR.$((STABLE_MINOR + 1)).0b1"
                else
                  NEW_VERSION="$BETA_MAJOR.$BETA_MINOR.${BETA_PATCH}b$((BETA_NUMBER + 1))"
                fi
              elif [[ "$LAST_STABLE_TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                NEW_VERSION="${BASH_REMATCH[1]}.$((BASH_REMATCH[2] + 1)).0b1"
              else
                NEW_VERSION="0.1.0b1"
              fi
              ;;
            rc)
              LAST_BETA_TAG=$(latest_tag '^[0-9]+\.[0-9]+\.[0-9]+b[0-9]+$')
              if [[ ! "$LAST_BETA_TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+)b[0-9]+$ ]]; then
                echo "::error::An RC release requires an existing beta tag"
                exit 1
              fi
              require_ancestor "$LAST_BETA_TAG"
              BETA_BASE="${BASH_REMATCH[1]}"

              if [[ "$LAST_TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+)rc([0-9]+)$ ]] \
                && [[ "${BASH_REMATCH[1]}" == "$BETA_BASE" ]]; then
                NEW_VERSION="${BETA_BASE}rc$((BASH_REMATCH[2] + 1))"
              else
                NEW_VERSION="${BETA_BASE}rc1"
              fi
              ;;
            stable)
              if [[ "$LAST_TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                NEW_VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
              else
                NEW_VERSION="0.1.0"
              fi
              ;;
          esac

          if git show-ref --verify --quiet "refs/tags/$NEW_VERSION"; then
            echo "::error::Calculated version $NEW_VERSION already exists as a Git tag"
            exit 1
          fi
          gh api --paginate --slurp \
            "repos/${{ github.repository }}/releases?per_page=100" \
            > "$RUNNER_TEMP/release-pages.json"
          if jq -e --arg version "$NEW_VERSION" \
            'any(add[]; .tag_name == $version)' \
            "$RUNNER_TEMP/release-pages.json" >/dev/null; then
            echo "::error::Calculated version $NEW_VERSION already exists as a GitHub release"
            exit 1
          fi

          {
            echo "should_release=true"
            echo "version=$NEW_VERSION"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved $CHANNEL release $NEW_VERSION from $SOURCE_SHA"

      - name: Log release decision
        env:
          SHOULD_RELEASE: ${{ steps.version.outputs.should_release }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$SHOULD_RELEASE" == "true" ]]; then
            echo "Creating ${{ steps.channel.outputs.channel }} release $VERSION"
          else
            echo "No release is needed"
          fi

  trigger-release:
    name: Create release
    needs: resolve-release
    if: needs.resolve-release.outputs.should_release == 'true'
    permissions:
      actions: write
      attestations: read
      contents: write
      packages: write
      pull-requests: read
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.resolve-release.outputs.version }}
      channel: ${{ needs.resolve-release.outputs.channel }}
      source_sha: ${{ needs.resolve-release.outputs.source_sha }}
      important_notes: ${{ inputs.important_notes }}
    secrets:
      TRIAGE_APP_ID: ${{ secrets.TRIAGE_APP_ID }}
      TRIAGE_APP_PRIVATE_KEY: ${{ secrets.TRIAGE_APP_PRIVATE_KEY }}
