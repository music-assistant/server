name: CodSpeed

on:
  push:
    branches:
      - stable
      - dev
    paths: &benchmark_paths
      # core code exercised by the benchmarks
      - "music_assistant/*.py"
      - "music_assistant/controllers/**"
      - "music_assistant/helpers/**"
      - "music_assistant/models/**"
      # providers loaded by the macro benchmarks
      - "music_assistant/providers/test/**"
      - "music_assistant/providers/builtin/**"
      - "music_assistant/providers/loudness_analysis/**"
      - "music_assistant/providers/playlist_metadata/**"
      - "music_assistant/providers/radio_playlist/**"
      - "music_assistant/providers/sync_group/**"
      - "music_assistant/providers/universal_player/**"
      # the benchmarks and toolchain itself
      - "tests/benchmarks/**"
      - ".github/workflows/codspeed.yml"
      - "pyproject.toml"
      - "requirements_all.txt"
      - ".python-version"
  pull_request:
    branches:
      - stable
      - dev
    paths: *benchmark_paths
  # `workflow_dispatch` allows CodSpeed to trigger backtest
  # performance analysis in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # for OpenID Connect authentication with CodSpeed

# Keep urllib3-future from hijacking the urllib3 namespace (see pyproject.toml).
env:
  URLLIB3_NO_OVERRIDE: "1"

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version-file: ".python-version"
          check-latest: true

      - name: Install uv
        run: pip install uv

      - name: Cache uv packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('.python-version') }}-${{ hashFiles('requirements_all.txt', 'pyproject.toml') }}

      - name: Install dependencies
        # --index-strategy: allow PyPI packages when also using the PyTorch extra index
        # https://docs.astral.sh/uv/pip/compatibility/#packages-that-exist-on-multiple-indexes
        run: uv pip install --system --index-strategy unsafe-best-match . .[test] -r requirements_all.txt

      - name: Run benchmarks
        uses: CodSpeedHQ/action@v4
        with:
          mode: simulation
          # -o addopts="" clears the default "--cov music_assistant" so coverage
          # instrumentation does not interfere with the CodSpeed measurements.
          run: pytest tests/benchmarks/ --codspeed -o addopts=""
