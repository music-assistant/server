---
name: PR Checks

# Release notes are generated verbatim from pull request titles, and the pull request template
# carries the rest: the change description, the "Types of changes" box pr-labels.yaml derives the
# release-notes label from, and the author's own verification checklist. A conventional-commit
# title has to be rewritten at release time, and a body that replaced the template drops the rest
# silently. Both are checked here, and reported to the author as one comment.
#
# Deliberately not a merge blocker. The result reaches the pull request as the "PR Checks" commit
# status. It runs from `dev` after the "PR event" workflow so the musicassistant-bot comment also
# works on pull requests from forks, and so the checks themselves can't be weakened by the branch
# under review. The title and description are read through the API and only `dev` is ever checked
# out, never the contributor's code.

# yamllint disable-line rule:truthy
on:
  workflow_run:
    workflows: [PR event]
    types: [completed]

permissions: {}

env:
  EXPECTED_APP_SLUG: musicassistant-bot
  EXPECTED_APP_INSTALLATION_ID: "146062122"
  EXPECTED_APP_BOT_LOGIN: musicassistant-bot[bot]
  STICKY_MARKER: "<!-- pr-checks -->"

jobs:
  check_pull_request:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    concurrency:
      group: >-
        ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{
        github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    steps:
      - name: ⤵️ Check out dev
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            .github
            scripts
          persist-credentials: false

      - name: 🔎 Find the pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const { findPullRequest } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/pr-event.cjs`);
            const pr = await findPullRequest({ github, context, core, base: 'dev' });
            // GitHub-typed bots (Dependabot, musicassistant-bot[bot], etc.) generate their own
            // titles and don't use the template.
            if (!pr || pr.user.type === 'Bot') {
              return;
            }
            fs.writeFileSync('title.txt', pr.title);
            fs.writeFileSync('body.md', pr.body || '');
            core.setOutput('number', pr.number);
            core.setOutput('author', pr.user.login);
            core.setOutput('head_sha', pr.head.sha);

      - name: 📝 Check the title and description
        id: check
        if: steps.pr.outputs.number
        continue-on-error: true
        run: |
          # The status is captured rather than piped through tee: the next step needs the
          # report file even when the check fails, and a pipeline would swallow the exit code.
          status=0
          python3 -m scripts.check_pr_metadata --title "$(cat title.txt)" < body.md > report.md || status=$?
          cat report.md
          exit "$status"

      - name: 🔑 Create musicassistant-bot token
        id: bot_token
        if: steps.pr.outputs.number
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.MUSIC_ASSISTANT_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MUSIC_ASSISTANT_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-pull-requests: write

      - name: 🤖 Verify GitHub App identity
        if: steps.pr.outputs.number
        env:
          APP_SLUG: ${{ steps.bot_token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.bot_token.outputs.installation-id }}
        run: |
          if [ "$APP_SLUG" != "$EXPECTED_APP_SLUG" ] || \
             [ "$INSTALLATION_ID" != "$EXPECTED_APP_INSTALLATION_ID" ]; then
            echo "Unexpected GitHub App installation: $APP_SLUG/$INSTALLATION_ID" >&2
            exit 1
          fi

      - name: 💬 Tell the author what's missing
        if: steps.pr.outputs.number
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
        with:
          github-token: ${{ steps.bot_token.outputs.token }}
          script: |
            const fs = require('fs');
            const marker = process.env.STICKY_MARKER;
            const failed = process.env.CHECK_OUTCOME === 'failure';
            const author = process.env.PR_AUTHOR;
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);

            // One sticky comment, edited in place: an "edited" event fires on every title or
            // description change, and a fresh comment each time would be spam. Matched on author
            // as well as marker — "Quote reply" copies the marker into someone else's comment,
            // and the token is allowed to edit those.
            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number },
            );
            const sticky = comments.find(c =>
              c.body?.includes(marker) && c.user?.login === process.env.EXPECTED_APP_BOT_LOGIN);

            const report = fs.existsSync('report.md')
              ? fs.readFileSync('report.md', 'utf8').trim()
              : '';

            // A failure with nothing to report means the check step itself broke rather than
            // finding problems with the pull request. "@author" and no message tells the author
            // nothing and reads as a stray ping, so say nothing here and let the job failure
            // carry it to whoever maintains the workflow.
            if (failed && !report) {
              core.setFailed('The check step produced no report; not commenting.');
              return;
            }

            const body = failed
              ? `${marker}\n@${author} ${report}`
              : `${marker}\n✅ The title and description are good to go. Thanks!`;

            if (sticky) {
              // Leave a resolved sticky untouched so a passing re-run doesn't renotify.
              if (sticky.body.trim() !== body.trim()) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: sticky.id, body,
                });
              }
              return;
            }
            if (failed) {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }

      - name: 🚦 Report the check result on the pull request
        if: steps.pr.outputs.number
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        with:
          script: |
            const failed = process.env.CHECK_OUTCOME === 'failure';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.HEAD_SHA,
              state: failed ? 'failure' : 'success',
              context: 'PR Checks',
              description: failed
                ? 'The title or description needs a fix, see the comment on the pull request'
                : 'The title and description are good to go',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
