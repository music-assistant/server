name: Critical review gate (poll)

# Scheduled gate: every ~10 minutes, scan open PRs and convert to a draft any whose LATEST Copilot
# review still has an unresolved, non-outdated [CRITICAL] thread (a draft PR cannot be merged), with
# one explanatory comment.
#
# Why a poller and not a `pull_request_review` trigger: GitHub holds workflow runs triggered by the
# Copilot bot for manual approval (they sit at `action_required` and never run), so an event-reactive
# gate never fires automatically. A scheduled run executes as a trusted actor with a write token,
# which also sidesteps the fork read-only-token and workflow_run artifact-trust problems.

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: critical-gate-poll
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Draft open PRs with an unresolved [CRITICAL] Copilot finding
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const BASES = ['dev', 'stable'];
            const COPILOT = 'copilot-pull-request-reviewer[bot]';  // exact reviewer login
            const GATE_BOT = 'github-actions[bot]';                // author of this gate's comments
            const MARKER = '<!-- critical-gate -->';
            const BODY = [
              MARKER,
              "🚧 **Automated critical-issue gate** — this PR has an unresolved **`[CRITICAL]`** " +
              "finding from the automated review, so it is kept as a **draft** (a draft PR can't be " +
              "merged) until that is resolved. Please address the `[CRITICAL]` thread(s), then mark " +
              "it **Ready for review**.",
              '',
              '_Maintainers: add the `override-critical` label to bypass this._',
            ].join('\n');

            // Gate only on the LATEST Copilot review's unresolved, non-outdated [CRITICAL] threads.
            // Copilot re-reviews the whole diff on each push, so its latest review is the current
            // verdict; older threads it did not re-raise are stale. Threads are matched to that
            // review by databaseId, which also pins the reviewer to the exact Copilot bot (a thread
            // from that review is Copilot's by construction) — no username substring matching.
            const THREADS = `query($owner:String!,$repo:String!,$num:Int!,$cursor:String){
              repository(owner:$owner,name:$repo){ pullRequest(number:$num){
                reviewThreads(first:100, after:$cursor){
                  pageInfo{ hasNextPage endCursor }
                  nodes{ isResolved isOutdated
                    comments(first:1){ nodes{ body pullRequestReview{ databaseId } } } }
                } } } }`;
            async function activeCritical(num) {
              const reviews = await github.paginate(github.rest.pulls.listReviews,
                { owner, repo, pull_number: num, per_page: 100 });
              const copilot = reviews.filter(r => r.user && r.user.login === COPILOT);
              if (copilot.length === 0) return false;
              const latestId = copilot[copilot.length - 1].id;  // REST id == GraphQL databaseId
              let cursor = null;
              for (;;) {
                const d = await github.graphql(THREADS, { owner, repo, num, cursor });
                const tr = d.repository.pullRequest.reviewThreads;
                for (const t of tr.nodes) {
                  if (t.isResolved || t.isOutdated) continue;
                  const c = t.comments.nodes[0];
                  if (c && c.pullRequestReview && c.pullRequestReview.databaseId === latestId
                        && (c.body || '').includes('[CRITICAL]')) return true;
                }
                if (!tr.pageInfo.hasNextPage) return false;
                cursor = tr.pageInfo.endCursor;
              }
            }

            const prs = await github.paginate(github.rest.pulls.list,
              { owner, repo, state: 'open', per_page: 100 });

            let failed = false, drafted = 0;
            for (const pr of prs) {
              try {
                if (!BASES.includes(pr.base.ref)) continue;
                if (pr.labels.some(l => l.name === 'override-critical')) continue;
                if (!(await activeCritical(pr.number))) continue;

                // Draft first — it is the gate; never swallow a failure.
                if (!pr.draft) {
                  await github.graphql(
                    'mutation($id: ID!) { convertPullRequestToDraft(input: { pullRequestId: $id }) { pullRequest { isDraft } } }',
                    { id: pr.node_id });
                  drafted++;
                  core.info(`PR #${pr.number}: drafted on unresolved [CRITICAL].`);
                }
                // Then the explanation, at most once — matched on marker AND our own bot author, so a
                // quoted or pre-posted marker in someone else's comment can't suppress it.
                const comments = await github.paginate(github.rest.issues.listComments,
                  { owner, repo, issue_number: pr.number, per_page: 100 });
                const posted = comments.some(c =>
                  c.user && c.user.login === GATE_BOT && (c.body || '').includes(MARKER));
                if (!posted) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: BODY });
                }
              } catch (e) {
                failed = true;
                core.error(`PR #${pr.number}: ${e.message}`);
              }
            }
            core.info(`Scanned ${prs.length} open PRs; drafted ${drafted}.`);
            if (failed) core.setFailed('One or more PRs could not be gated; see errors above.');
