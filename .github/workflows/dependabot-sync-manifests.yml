# Dependabot only understands requirements_all.txt, but that file is autogenerated from the
# provider manifest.json files (see scripts/gen_requirements_all). A bump that lands only in
# requirements_all.txt is reverted by the gen_requirements_all pre-commit hook, so CI fails.
#
# This workflow back-propagates the bumped pin into the owning manifest.json and regenerates
# requirements_all.txt, then pushes the fix onto the Dependabot branch.

name: Sync manifests on Dependabot PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches:
      - dev

permissions:
  contents: read

jobs:
  sync-manifests:
    name: Back-sync provider manifests
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
    steps:
      # persist-credentials: false keeps the (privileged) push token out of the git config while
      # the checked-out Dependabot branch contents are processed below. The push step re-attaches
      # the music-assistant-machine credential (PRIVILEGED_GITHUB_TOKEN) only for the push itself,
      # so the pushed commit re-triggers the required checks (the default GITHUB_TOKEN would not).
      - name: Check out the Dependabot branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Determine packages bumped in requirements_all.txt
        id: bumped
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Fetch the base branch so we can diff against the PR's true fork point and, later, run
          # its current (trusted) tooling. base.ref (not base.sha) is used throughout: the base tip
          # is the branch that actually carries the workflow + sync script, whereas base.sha may be
          # an old fork point and is not reliably present in this shallow PR-head checkout.
          git fetch --no-tags origin "$BASE_REF"
          MERGE_BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          # Names of packages whose pin changed on the added side of the diff. The platform-
          # conditional entries gen_requirements_all synthesises for alternate-index packages (the
          # PyTorch CPU wheels, identified by their "platform_machine" marker) are excluded: those
          # are never authored in a manifest, so the sync script skips them and including them here
          # would only make gen_requirements_all revert the bump.
          PACKAGES=$(git diff "$MERGE_BASE" HEAD -- requirements_all.txt \
            | grep -E '^\+[^+-]' \
            | grep -v 'platform_machine' \
            | grep -oiE '^\+[A-Za-z0-9._-]+' \
            | sed 's/^+//' | sort -u | tr '\n' ' ')
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "Bumped packages: ${PACKAGES:-<none>}"

      - name: Set up Python
        if: steps.bumped.outputs.packages != ''
        uses: actions/setup-python@v6.3.0
        with:
          python-version-file: ".python-version"
          check-latest: true

      - name: Sync manifests and regenerate requirements_all.txt
        if: steps.bumped.outputs.packages != ''
        env:
          # Pass via env (not inline ${{ }}) to avoid shell injection; the names are already
          # constrained to [A-Za-z0-9._-] above, and word-splitting them into args is intended.
          PACKAGES: ${{ steps.bumped.outputs.packages }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Run the trusted base-branch tooling (fetched above) against the PR's data files: the PR
          # branch may predate the sync script, and we must never execute scripts from the PR head.
          # Unstage the overlay so it is never part of the commit pushed back to the branch.
          git checkout "origin/$BASE_REF" -- scripts/
          git reset -q -- scripts/
          python -m scripts.sync_manifest_from_requirements $PACKAGES
          python -m scripts.gen_requirements_all

      - name: Commit and push the manifest sync
        if: steps.bumped.outputs.packages != ''
        env:
          PUSH_TOKEN: ${{ secrets.PRIVILEGED_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          # Stage only the data files (the base-branch scripts/ overlay is left unstaged) and key
          # the "nothing to push" check off the staged set, so unrelated working-tree noise from
          # the overlay never triggers a push or sneaks into the commit.
          git add music_assistant/providers/*/manifest.json requirements_all.txt
          if git diff --cached --quiet; then
            echo "Manifests already in sync, nothing to push"
            exit 0
          fi
          git config user.name "dependabot[bot]"
          git config user.email "49699333+dependabot[bot]@users.noreply.github.com"
          git commit -m "Sync provider manifests with dependency bump"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git" "HEAD:$HEAD_REF"
