[project]
name = "music_assistant"
# The version is set by GH action on release
authors = [
  {name = "The Music Assistant Authors", email = "marcelveldt@users.noreply.github.com"},
]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "aiodns>=4.0.4",
  "aiohttp_asyncmdnsresolver==0.2.0",
  "Brotli>=1.0.9",
  "aiohttp==3.14.1",
  "aiohttp-fast-zlib==0.3.0",
  "aiohttp-socks==0.11.0",
  "aiofiles==24.1.0",
  "aiosqlite==0.22.1",
  "awesomeversion>=24.6.0",
  "certifi==2025.11.12",
  "colorlog==6.10.1",
  "modern_colorthief==0.2.1",
  "cryptography==49.0.0",
  "chardet>=5.2.0",
  "ifaddr==0.2.0",
  "getmac==0.9.5",
  "mashumaro==3.20",
  "music-assistant-models==1.1.176",
  "music-assistant-frontend==2.17.251",
  "mutagen==1.48.1",
  "orjson==3.11.6",
  "pillow==12.3.0",
  "podcastparser==0.6.11",
  "propcache>=0.2.1",
  "python-slugify==8.0.4",
  "unidecode==1.4.0",
  "xmltodict==1.0.4",
  "markdownify==1.2.3",
  "shortuuid==1.0.13",
  "zeroconf==0.149.16",
  "uv>=0.8.0",
  "librosa==0.11.0",
  "numpy==2.3.5", # numpy 2.4.0+ uses X86_V2 CPU baseline (requires SSE4.2) which breaks older CPUs https://github.com/music-assistant/support/issues/5005#issuecomment-3972476728
  "torch==2.13.0",
  "torchaudio==2.11.0",
  "gql[all]==4.0.0",
  # TEMPORARY test-drive pin — replace with PyPI release before merge (see webrtc_aiolibdatachannel_plan.md Phase C)
  "aiolibdatachannel @ git+https://github.com/music-assistant/aiolibdatachannel@feat/certpem-testdrive",
  "pyjwt[crypto]>=2.10.1",
]
description = "Music Assistant"
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.14"
version = "0.0.0"

[project.optional-dependencies]
test = [
  "codespell==2.4.3",
  "mypy==2.3.0",
  "pre-commit==4.6.0",
  "pre-commit-hooks==6.0.0",
  "psutil==7.2.2",
  "pytest==9.0.3",
  "pytest-aiohttp==1.1.0",
  "pytest-codspeed==5.0.3",
  "pytest-cov==7.0.0",
  "pytest-timeout==2.4.0",
  "syrupy==5.2.0",
  "tomli==2.4.1",
  "ruff==0.15.22",
  "yappi==1.7.6",
]

[project.scripts]
mass = "music_assistant.__main__:main"

[tool.codespell]
# explicit is misspelled in the iTunes API
# "additionals" is a fixed field name from the Nicovideo API fixtures
# "connexion" is a French word in the MusicMe login URL path
# "claus" is Santa Claus, in the christmas_music genre description
# "childrens" is the normalized form of the "Children's" audiobook genre (apostrophe stripped)
# translations/*.json are machine-translated locale files (Lokalise); foreign words aren't typos
ignore-words-list = "provid,hass,followings,childs,explict,additionals,commitish,nam,connexion,claus,childrens,"
skip = """*.js,*.svg,\
music_assistant/helpers/resources/countries.json,\
music_assistant/helpers/resources/genres/genre_mapping.json,\
music_assistant/providers/sonic_analysis/vendored_clap/**,\
music_assistant/translations/*.json,\
NOTICE,\
"""

[tool.setuptools]
include-package-data = true
packages = ["music_assistant"]
platforms = ["any"]
zip-safe = false

[tool.setuptools.package-data]
music_assistant = ["py.typed", "helpers/app_secrets.json"]

[tool.ruff]
fix = true
show-fixes = true

line-length = 100
target-version = "py314"

[tool.ruff.lint.pydocstyle]
# Use Sphinx-style docstrings with :param: syntax
# pep257 is the base convention, we enforce Sphinx-style parameters separately
convention = "pep257"

[tool.ruff.lint.pylint]

max-args = 10
max-branches = 25
max-returns = 15
max-statements = 50

[tool.mypy]
platform = "linux"
python_version = "3.14"

# set this to normal when we have fixed all exclusions
follow_imports = "silent"

# suppress errors about unsatisfied imports
ignore_missing_imports = true

# be strict
check_untyped_defs = true
disable_error_code = [
  "annotation-unchecked",
  "import-not-found",
  "import-untyped",
]
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
enable_error_code = [
  "ignore-without-code",
  "redundant-self",
  "truthy-iterable",
]
exclude = [
  '^music_assistant/providers/sonic_analysis/vendored_clap/.*$',
]
extra_checks = false
local_partial_types = true
no_implicit_optional = true
no_implicit_reexport = true
packages = [
  "tests",
  "music_assistant",
]
show_error_codes = true
strict_equality = true
strict_optional = true
warn_incomplete_stub = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

# plexapi ships a py.typed marker but its annotations are incomplete (unannotated
# methods, attributes declared as None and only set dynamically). Treat it as an
# untyped dependency rather than trusting its type info.
[[tool.mypy.overrides]]
follow_imports = "skip"
module = ["plexapi", "plexapi.*"]

[tool.ruff.format]
# Force Linux/macOS line endings
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "--cov music_assistant"
asyncio_mode = "auto"
timeout = 120
filterwarnings = [
  # Suppress Python 3.14 AsyncMock internal warnings about unawaited coroutines
  "ignore:coroutine.*was never awaited:RuntimeWarning",
]

[tool.ruff.lint]
ignore = [
  "ANN002", # Just annoying, not really useful
  "ANN003", # Just annoying, not really useful
  "ANN401", # Opinioated warning on disallowing dynamically typed expressions
  "D203", # Conflicts with other rules
  "D417", # False positives in some occasions
  "EM101", # Just annoying, not really useful
  "EM102", # Just annoying, not really useful
  "FIX002", # Just annoying, not really useful
  "PLR2004", # Just annoying, not really useful
  "PGH004", # Just annoying, not really useful
  "PD011", # Just annoying, not really useful
  "S101", # assert is often used to satisfy type checking
  "TC001", # Just annoying, not really useful
  "TC003", # Just annoying, not really useful
  "TD002", # Just annoying, not really useful
  "TD003", # Just annoying, not really useful
  "TD004", # Just annoying, not really useful
  "TRY003", # Just annoying, not really useful
  "TRY400", # Just annoying, not really useful
  "COM812", # Conflicts with the Ruff formatter
  "ASYNC109", # Not relevant, since we use helpers with configurable timeouts
  "ASYNC110", # Use `asyncio.Event` instead of awaiting `asyncio.sleep` in a `while` loop
  "N818", # Just annoying, not really useful
  "E501", # Handled by ruff formatter
  "ASYNC240", # Not relevant, we use asyncio not trio/anyio
  "UP047", # Not yet ready to migrate to type parameters
  "PLW0108", # Just annoying, not really useful
  "FURB110", # Just annoying, not really useful  # TEMPORARY DISABLED rules  # The below rules must be enabled later one-by-one !
  "BLE001",
  "FBT001",
  "FBT002",
  "FBT003",
  "ANN001",
  "ANN201",
  "ANN202",
  "TRY002",
  "PTH103",
  "PTH100",
  "PTH110",
  "PTH111",
  "PTH112",
  "PTH113",
  "PTH118",
  "PTH120",
  "PTH123",
  "G004",
  "S104",
  "S105",
  "S106",
  "SLF001",
  "SIM102",
  "PERF401",
  "PERF402",
  "ARG002",
  "S311",
  "TRY301",
  "PLR0912",
  "B904",
  "TRY401",
  "S324",
  "ERA001",
  "PTH206",
  "C901",
  "S304",
  "TRY300",
  "S608",
  "B007",
  "ANN204",
]

select = ["ALL"]
# Enforce the multi-line docstring summary on the second line (the pep257 convention disables both
# D212 and D213; we re-enable D213 so our "summary starts on the next line" style is checked).
extend-select = ["D213"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
known-first-party = ["music_assistant"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[[tool.uv.index]]
explicit = true
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv]
# Build urllib3-future (pulled in via niquests) from source so URLLIB3_NO_OVERRIDE=1 set during
# installs takes effect, stopping it from hijacking the stock urllib3 namespace server-wide.
no-binary-package = ["urllib3-future"]

[tool.uv.sources]
torch = {index = "pytorch-cpu"}
torchaudio = {index = "pytorch-cpu"}

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61"]
